                    const matchName = item.nama.toLowerCase().includes(liveSearch.toLowerCase());
                    const matchClass = liveClassFilter === "Semua" || (item.kelas && item.kelas === liveClassFilter);
                    return matchName && matchClass;
                });
                const totalHadir = liveAttendance.length;
                const totalFiltered = displayData.length;

                return (
                <div className="min-h-screen bg-slate-50 relative flex flex-col">
                    <div className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
                        <div className="p-4 pb-2 flex items-center justify-between">
                             <button onClick={() => isPeserta ? handleBackToMenu() : setView('admin_dashboard')} className="bg-slate-100 text-slate-600 p-2 rounded-xl font-bold border-b-2 border-slate-300 hover:bg-slate-200 transition active:scale-95">
                                <i data-lucide="arrow-left" width="20"></i>
                             </button>
                              <div className="text-right">
                                <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Keseluruhan</h2>
                                <p className="text-2xl font-black text-emerald-500 font-fredoka leading-none flex items-center justify-end gap-1">
                                    <i data-lucide="users" width="20" className="text-emerald-300"></i>
                                    {totalHadir}
                                 </p>
                             </div>
                        </div>

                        <div className="px-4 pb-4 space-y-3">
                            <div className="flex gap-2">
                                <div className="relative flex-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i data-lucide="calendar" width="14" className="text-slate-400"></i>
                                    </div>
                                    <input type="date" value={viewDate} onChange={(e) => setViewDate(e.target.value)} className="w-full bg-slate-100 text-slate-700 text-xs font-bold py-2.5 pl-9 pr-3 rounded-xl border-transparent focus:bg-white focus:border-indigo-400 focus:ring-0 transition" />
                                </div>
                                <button onClick={handleExportAttendance} className="bg-green-100 text-green-700 px-3 rounded-xl hover:bg-green-200 border border-green-200 font-bold flex items-center justify-center transition active:scale-95">
                                    <i data-lucide="sheet" width="18"></i>
                                </button>
                                 {!isPeserta && liveAttendance.length > 0 && (
                                    <button onClick={handleResetDailyData} className="bg-rose-100 text-rose-600 px-3 rounded-xl hover:bg-rose-200 border border-rose-200 font-bold flex items-center justify-center transition active:scale-95">
                                        <i data-lucide="trash-2" width="18"></i>
                                    </button>
                                )}
                            </div>

                            <div className="flex gap-2">
                                <div className="relative flex-[2]">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i data-lucide="search" width="14" className="text-indigo-400"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Cari Nama..." 
                                        value={liveSearch}
                                        onChange={(e) => setLiveSearch(e.target.value)}
                                        className="w-full bg-indigo-50/50 border border-indigo-100 text-slate-700 text-sm font-bold py-2.5 pl-9 pr-3 rounded-xl focus:outline-none focus:bg-white focus:border-indigo-500 transition placeholder-indigo-300" 
                                    />
                                </div>
                                <div className="relative flex-1">
                                     <select 
                                        value={liveClassFilter} 
                                        onChange={(e) => setLiveClassFilter(e.target.value)}
                                        className="w-full h-full bg-white border border-slate-200 text-slate-600 text-[10px] font-bold py-2 px-2 rounded-xl focus:outline-none focus:border-indigo-500 appearance-none"
                                    >
                                        <option value="Semua">Semua Kelas</option>
                                        {classList.map(c => <option key={c} value={c}>{c}</option>)}
                                        <option value="-">Tanpa Kelas</option>
                                    </select>
                                    <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                                        <i data-lucide="chevron-down" width="12" className="text-slate-400"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 p-4 pb-24 overflow-y-auto bg-slate-50 min-h-[50vh]">
                        {displayData.length === 0 ? (
                            <div className="flex flex-col items-center justify-center pt-10 opacity-60">
                                <div className="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                                    <i data-lucide={liveAttendance.length === 0 ? "clipboard-list" : "search-x"} className="w-10 h-10 text-slate-300"></i>
                                </div>
                                <h3 className="font-black text-slate-400 text-sm">
                                    {liveAttendance.length === 0 ? `Belum ada data ${viewDate}` : "Nama tidak ditemukan"}
                                </h3>
                                {liveAttendance.length === 0 && <p className="text-[10px] text-slate-400 mt-1">Scan QR untuk mulai absen</p>}
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {liveClassFilter !== "Semua" && (
                                    <div className="text-center mb-2">
                                        <span className="bg-indigo-100 text-indigo-600 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">
                                            Menampilkan Kelas {liveClassFilter}: {totalFiltered} Jiwa
                                        </span>
                                    </div>
                                )}
                                
                                {displayData.map((item, idx) => (
                                    <div key={idx} className="group bg-white p-3 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 flex items-center gap-3 animate-bounce-in relative overflow-hidden">
                                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${
                                            item.status === 'Hadir' ? 'bg-emerald-400' : 
                                            item.status === 'Sakit' ? 'bg-blue-400' : 
                                            item.status === 'Izin' ? 'bg-orange-400' : 'bg-red-400'
                                        }`}></div>

                                        <div className="flex flex-col items-center justify-center bg-slate-50 min-w-[56px] h-[56px] rounded-xl border border-slate-100 ml-2">
                                            <span className="text-[14px] font-black text-slate-700 leading-none">{item.jam.split(':')[0]}</span>
                                            <span className="text-[10px] font-bold text-slate-400 leading-none mt-0.5">{item.jam.split(':')[1]}</span>
                                        </div>

                                        <div className="flex-1 min-w-0 py-1">
                                            <h4 className="font-bold text-slate-800 text-sm truncate leading-tight mb-1">{item.nama}</h4>
                                            <div className="flex flex-wrap items-center gap-1.5">
                                                <span className="text-[10px] font-bold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">
                                                    {item.kategori}
                                                 </span>
                                                {item.kelas && item.kelas !== '-' && (
                                                    <span className="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100 flex items-center gap-1">
                                                        <i data-lucide="graduation-cap" width="10"></i> {item.kelas}
                                                    </span>
                                                )}
                                            </div>
                                        </div>

                                        <div className={`px-2 py-1 rounded-lg text-[10px] font-black uppercase tracking-wide transform -rotate-2 group-hover:rotate-0 transition ${
                                            item.status === 'Hadir' ? 'bg-emerald-100 text-emerald-600' : 
                                            item.status === 'Sakit' ? 'bg-blue-100 text-blue-600' : 
                                            item.status === 'Izin' ? 'bg-orange-100 text-orange-600' : 'bg-red-100 text-red-600'
                                        }`}>
                                            {item.status}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
                );
            }

            if (view === 'scan') {
                const totalHadir = liveAttendance.length;
                return (
                <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4 relative">
                    
                    <button onClick={() => setView('admin_dashboard')} className="absolute top-6 left-6 btn-playful bg-white/20 text-white hover:bg-white/30 backdrop-blur-sm px-4 py-2 rounded-xl flex items-center gap-2 font-bold border-2 border-white/30 z-50">
                        <i data-lucide="arrow-left" width="18"></i> Kembali
                    </button>

                    {attendanceMode && (
                        <button onClick={() => setView('live_report')} className="absolute top-6 right-6 btn-playful bg-emerald-500 text-white hover:bg-emerald-600 backdrop-blur-sm px-4 py-2 rounded-xl flex items-center gap-2 font-bold border-b-4 border-emerald-700 z-50 text-xs shadow-lg">
                            <i data-lucide="users" width="16"></i> <span>{totalHadir} Hadir</span>
                        </button>
                    )}

                    <div className="w-full max-w-sm bg-white rounded-3xl overflow-hidden shadow-2xl relative">
                        
                        <div className="relative bg-black">
                            <div id="reader" className="w-full h-auto min-h-[300px]"></div>
                               
                            {!scanResult && (
                                <button onClick={toggleCamera} className="absolute bottom-4 right-4 bg-white/20 hover:bg-white/40 backdrop-blur-md p-3 rounded-full text-white border-2 border-white/50 z-10 transition-transform active:scale-95 shadow-lg" title="Ganti Kamera">
                                    <i data-lucide="refresh-ccw" width="24" height="24"></i>
                                </button>
                            )}
                        </div>

                        {scanResult && (
                            <div className={`absolute bottom-0 left-0 w-full p-6 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.2)] animate-bounce-in z-20 ${scanResult.success ? 'bg-white' : 'bg-rose-50'}`}>
                                
                                <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto -mt-14 border-4 border-white shadow-lg mb-3 ${scanResult.success ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                                    <i data-lucide={scanResult.success ? "check" : "x"} width="32" height="32"></i>
                                </div>

                                <h3 className={`text-xl font-black text-center mb-1 ${scanResult.success ? 'text-slate-800' : 'text-rose-600'}`}>
                                    {scanResult.msg}
                                </h3>
                                
                                {scanResult.subMsg && (
                                    <p className="text-center text-sm text-slate-500 font-bold mb-4 uppercase tracking-wide">
                                        {scanResult.subMsg}
                                    </p>
                                )}

                                {scanResult.success && scanResult.p && (
                                    <div className="bg-slate-50 p-4 rounded-xl border-2 border-slate-100 mb-4 text-left space-y-2 relative mt-4">
                                        {scanResult.time && <div className="absolute top-2 right-2 bg-emerald-500 text-white text-xs font-black px-2 py-1 rounded-lg shadow-sm">{scanResult.time}</div>}
                                        <div>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase">Nama Lengkap</p>
                                            <p className="font-black text-lg text-slate-700">{scanResult.p.nama}</p>
                                        </div>
                                        <div className="flex gap-4">
                                            <div>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase">Kategori</p>
                                                <p className="font-bold text-sm text-indigo-600 bg-indigo-50 px-2 py-1 rounded inline-block">{scanResult.p.kategori}</p>
                                            </div>
                                            <div>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase">Kelas</p>
                                                <p className="font-bold text-sm text-indigo-600 bg-indigo-50 px-2 py-1 rounded inline-block">{scanResult.p.kelas || '-'}</p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <button onClick={() => { setScanResult(null); }} className="w-full btn-playful btn-blue py-3 rounded-xl font-bold mt-2">
                                    Scan Lagi
                                </button>
                            </div>
                        )}
                    </div>
                    
                    <p className="text-white/50 text-xs font-bold mt-6 text-center max-w-xs">
                        {cameraFacing === 'environment' ? 'Kamera Belakang' : 'Kamera Depan'} Aktif <br/>
                        Tap ikon putar untuk ganti kamera.
                    </p>
                </div>
                );
            }

            if (view === 'edit_theme') return (
                <div className="min-h-screen bg-slate-50 p-4 pb-20">
                    <div className="max-w-md mx-auto">
                        <div className="flex items-center justify-between mb-6">
                            <button onClick={() => setView('admin_dashboard')} className="btn-playful btn-white px-4 py-2 rounded-xl flex items-center gap-2 font-bold"><i data-lucide="arrow-left" width="18"></i> Kembali</button>
                            <h2 className="font-black text-xl text-slate-700">Edit Bahan Ajar</h2>
                        </div>
                        <div className="bg-white p-6 rounded-3xl shadow-lg border-2 border-indigo-100 space-y-4 mb-4">
                            <div><label className="block text-xs font-bold text-slate-400 uppercase mb-2">Judul Besar / Tema Bulanan</label><input className="w-full p-3 border-2 border-slate-200 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-indigo-400" value={editThemeForm.title} onChange={e => setEditThemeForm({...editThemeForm, title: e.target.value})} placeholder="Contoh: Kasih Allah..." /></div>
                        </div>
                        <div className="space-y-4">
                            {editThemeForm.weeks.map((week, index) => (
                                <div key={index} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 relative group">
                                    <button onClick={() => handleRemoveWeek(index)} className="absolute top-4 right-4 bg-rose-100 hover:bg-rose-200 text-rose-500 p-2 rounded-xl transition shadow-sm" title="Hapus Minggu Ini"><i data-lucide="trash-2" width="18"></i></button>
                                    <h3 className="font-black text-indigo-500 text-sm uppercase tracking-widest mb-4">Minggu ke-{index + 1}</h3>
                                    <div className="space-y-3">
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase">Tanggal (Opsional)</label><input type="date" className="w-full p-2 border rounded-lg font-bold text-slate-600 text-sm" value={week.date} onChange={e => handleWeekChange(index, 'date', e.target.value)} /></div>
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase">Topik / Judul Minggu Ini</label><input className="w-full p-2 border rounded-lg font-bold text-slate-700 text-sm" value={week.topic} onChange={e => handleWeekChange(index, 'topic', e.target.value)} placeholder="Contoh: Minggu 1: Ketaatan" /></div>
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase">Ayat Tema (Singkat)</label><input className="w-full p-2 border rounded-lg font-bold text-slate-700 text-sm" value={week.themeVerse} onChange={e => handleWeekChange(index, 'themeVerse', e.target.value)} placeholder="Contoh: Yohanes 3:16" /></div>
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase">Ayat Hafalan (Isi Lengkap)</label><textarea className="w-full p-2 border rounded-lg font-medium text-slate-600 text-xs h-16" value={week.memoryVerse} onChange={e => handleWeekChange(index, 'memoryVerse', e.target.value)} placeholder="Tulis ayat hafalan disini..." /></div>
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase">Isi Ringkasan Materi</label><textarea className="w-full p-2 border rounded-lg font-medium text-slate-600 text-sm h-24" value={week.content} onChange={e => handleWeekChange(index, 'content', e.target.value)} placeholder="Ringkasan khotbah..." /></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <button onClick={handleAddWeek} className="w-full py-4 rounded-xl border-2 border-dashed border-indigo-300 text-indigo-500 font-bold mt-4 hover:bg-indigo-50 transition flex items-center justify-center gap-2"><i data-lucide="plus-circle" width="20"></i> Tambah Minggu Baru</button>
                        
                        <div className="sticky bottom-4 mt-6 flex gap-2">
                             <button onClick={handleArchiveCurrentTheme} className="flex-1 btn-playful bg-slate-700 border-slate-900 text-white py-4 rounded-2xl font-black text-xs shadow-xl"><i data-lucide="archive" width="16" className="inline mr-1"></i> ARSIPKAN</button>
                             <button onClick={handleSaveTheme} className="flex-[2] btn-playful btn-blue py-4 rounded-2xl font-black text-lg shadow-xl shadow-sky-200">SIMPAN PERUBAHAN</button>
                        </div>
                    </div>
                </div>
            );

            // --- VIEW NEW: THEME ARCHIVES ---
            if (view === 'theme_archives') {
                return (
                    <div className="min-h-screen bg-slate-50 p-4 pb-20">
                         <div className="max-w-md mx-auto">
                            <div className="flex items-center justify-between mb-6 sticky top-0 bg-slate-50/90 backdrop-blur-md py-2 z-20">
                                <button onClick={handleBackToMenu} className="btn-playful btn-white px-4 py-2 rounded-xl flex items-center gap-2 font-bold"><i data-lucide="arrow-left" width="18"></i> Kembali</button>
                                <h2 className="font-black text-xl text-slate-700">Riwayat Bahan Ajar</h2>
                            </div>

                            <div className="space-y-4">
                                {themeArchives.length === 0 ? (
                                    <div className="text-center p-8 opacity-50 border-2 border-dashed border-slate-300 rounded-xl bg-white">
                                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i data-lucide="folder-open" className="text-slate-400 w-8 h-8"></i>
                                        </div>
                                        <p className="font-bold text-sm text-slate-400">Belum ada arsip tersimpan.</p>
                                    </div>
                                ) : (
                                    themeArchives.map((archive) => (
                                        <div key={archive.id} className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden group">
                                            <div className="p-5 border-b border-slate-50 flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-black text-lg text-slate-800 leading-tight mb-1">"{archive.title}"</h3>
                                                    <p className="text-xs text-slate-400 font-bold">Diarsipkan: {new Date(archive.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                                                </div>
                                                {(isAdmin || isPanitia) && (
                                                    <button onClick={() => { if(confirm("Hapus arsip ini?")) deleteFromCloud(`theme_archives/${archive.id}`) }} className="text-slate-300 hover:text-rose-500 p-1"><i data-lucide="trash-2" width="16"></i></button>
                                                )}
                                            </div>
                                            <div className="bg-slate-50 p-3 grid gap-2">
                                                 {(archive.weeks || []).map((week, idx) => (
                                                    <button key={idx} onClick={() => setSelectedWeek(week)} className="w-full text-left bg-white p-3 rounded-xl border border-slate-100 hover:border-indigo-200 hover:shadow-sm transition flex items-center justify-between group-week">
                                                        <span className="text-xs font-bold text-slate-600 truncate flex-1">
                                                            <span className="text-indigo-500 mr-2">Minggu {idx+1}:</span> {week.topic}
                                                        </span>
                                                        <i data-lucide="chevron-right" width="14" className="text-slate-300"></i>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                         </div>
                         <WeekDetailModal week={selectedWeek} onClose={() => setSelectedWeek(null)} />
                    </div>
                );
            }

            if (view === 'backup_restore') return (
                <div key="view-backup_restore" className="min-h-screen bg-slate-50 p-4">
                    <div className="max-w-md mx-auto">
                        <button onClick={() => setView('admin_dashboard')} className="mb-4 btn-playful btn-white px-4 py-2 rounded-xl w-fit flex gap-2 font-bold"><i data-lucide="arrow-left"></i> Kembali</button>

                        <div className="bg-white rounded-2xl shadow p-6 mb-4">
                            <div className="flex items-center gap-3 mb-1">
                                <div className="w-10 h-10 bg-teal-100 text-teal-600 rounded-xl flex items-center justify-center"><i data-lucide="database-backup" width="22"></i></div>
                                <div>
                                    <h2 className="font-black text-lg text-slate-800 font-fredoka leading-none">Backup & Restore</h2>
                                    <p className="text-[11px] font-bold text-slate-400 mt-0.5">Cadangkan & pulihkan seluruh data aplikasi</p>
                                </div>
                            </div>
                        </div>

                        {/* BACKUP */}
                        <div className="bg-white rounded-2xl shadow p-5 mb-4">
                            <h3 className="font-black text-slate-700 text-sm mb-1 flex items-center gap-2"><i data-lucide="download" width="16" className="text-teal-600"></i> Buat Backup</h3>
                            <p className="text-xs text-slate-500 mb-3">Mengunduh 1 file JSON berisi seluruh data: peserta, user, pengaturan, tema, dan riwayat absensi.</p>
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Pindai Absensi Sejak Tanggal</label>
                            <input type="date" value={backupStartDate} onChange={e => setBackupStartDate(e.target.value)} className="w-full mt-1 mb-1 bg-slate-50 border-2 border-slate-100 text-slate-700 text-sm font-bold py-2.5 px-3 rounded-xl focus:outline-none focus:border-teal-400" />
                            <p className="text-[10px] text-slate-400 mb-3 ml-1">Pilih tanggal lebih awal agar semua riwayat absensi ikut tercadangkan (mis. awal tahun aplikasi mulai dipakai).</p>
                            <button onClick={handleBackup} disabled={backupBusy} className={"w-full text-white font-black py-3.5 rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-sm " + (backupBusy ? 'bg-slate-400 cursor-wait' : 'bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 shadow-teal-200')}>
                                {backupBusy ? (<><span className="inline-block animate-spin"><i data-lucide="loader" width="18"></i></span> Mencadangkan...</>) : (<><i data-lucide="download" width="18"></i> Unduh File Backup</>)}
                            </button>
                        </div>

                        {/* RESTORE */}
                        <div className="bg-white rounded-2xl shadow p-5 mb-4">
                            <h3 className="font-black text-slate-700 text-sm mb-1 flex items-center gap-2"><i data-lucide="upload" width="16" className="text-orange-500"></i> Pulihkan dari Backup</h3>
                            <p className="text-xs text-slate-500 mb-3">Pilih file backup (.json) untuk memulihkan data ke database. Data yang ada akan ditimpa oleh isi backup.</p>
                            <div className="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center relative hover:bg-slate-50 transition">
                                <input type="file" accept=".json,application/json" onChange={handleRestoreFile} className="absolute inset-0 opacity-0 cursor-pointer" />
                                <i data-lucide="file-up" className="mx-auto text-orange-400 w-7 h-7 mb-1"></i>
                                <span className="text-sm font-bold text-orange-600 block">Pilih File Backup (.json)</span>
                            </div>
                            {restoreFileData && (
                                <div className="mt-3 bg-orange-50 border border-orange-200 rounded-xl p-3">
                                    <p className="text-xs font-black text-orange-700 mb-1 flex items-center gap-1"><i data-lucide="file-check" width="14"></i> File backup terbaca</p>
                                    <div className="text-[11px] font-bold text-slate-600 space-y-0.5">
                                        <p>Dibuat: {restoreFileData._meta.createdAt ? new Date(restoreFileData._meta.createdAt).toLocaleString('id-ID') : '-'}</p>
                                        <p>Peserta: {restoreFileData._meta.summary?.participants ?? '?'} · User: {restoreFileData._meta.summary?.users ?? '?'}</p>
                                        <p>Absensi: {restoreFileData._meta.summary?.attendanceDays ?? '?'} hari ({restoreFileData._meta.summary?.attendanceRecords ?? '?'} catatan)</p>
                                    </div>
                                    <button onClick={handleRestore} disabled={restoreBusy} className={"w-full mt-3 text-white font-black py-3 rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm " + (restoreBusy ? 'bg-slate-400 cursor-wait' : 'bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700')}>
                                        {restoreBusy ? (<><span className="inline-block animate-spin"><i data-lucide="loader" width="16"></i></span> Memulihkan...</>) : (<><i data-lucide="upload" width="16"></i> Pulihkan Sekarang</>)}
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* LOG */}
                        {backupLog.length > 0 && (
                            <div className="bg-slate-900 rounded-2xl shadow p-4 mb-4">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Log Proses</p>
                                <div className="font-mono text-[11px] text-emerald-300 space-y-0.5 max-h-48 overflow-y-auto">
                                    {backupLog.map((l, i) => <div key={i} className="whitespace-pre-wrap">{l}</div>)}
                                </div>
                            </div>
                        )}

                        <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4">
                            <p className="text-xs font-bold text-blue-700 flex items-start gap-2"><i data-lucide="info" width="16" className="flex-shrink-0 mt-0.5"></i> <span>Simpan file backup di tempat aman (Google Drive, dll). Lakukan backup rutin, terutama setelah sermon. File ini cukup untuk membangun ulang aplikasi bila terjadi crash.</span></p>
                        </div>
                    </div>
                    {deleteConfig.show && <DeleteConfirmModal />}
                </div>
            );

            if (view === 'manage_users') return (
                <div key="view-manage_users" className="min-h-screen bg-slate-50 p-4">
                    <div className="max-w-md mx-auto">
                        <button onClick={() => setView('admin_dashboard')} className="mb-4 btn-playful btn-white px-4 py-2 rounded-xl w-fit flex gap-2 font-bold"><i data-lucide="arrow-left"></i> Kembali</button>
                        {/* Grid Tombol Import & Export User */}
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <div className="bg-white rounded-xl shadow p-3 border-2 border-dashed border-indigo-200 text-center relative hover:bg-indigo-50 transition cursor-pointer">
                                <input type="file" accept=".csv, .xlsx, .xls" onChange={handleImportUsers} className="absolute inset-0 opacity-0 cursor-pointer" />
                                <i data-lucide="upload-cloud" className="mx-auto text-indigo-400 w-7 h-7 mb-1"></i>
                                <span className="text-xs font-bold text-indigo-600 block">Import User</span>
                                <span className="text-[9px] text-gray-400">Format: User,Pass,Nama,Role</span>
                            </div>
                            
                            <button onClick={handleExportUsers} className="w-full bg-white rounded-xl shadow p-3 border-2 border-dashed border-emerald-200 text-center hover:bg-emerald-50 transition">
                                <i data-lucide="download-cloud" className="mx-auto text-emerald-500 w-7 h-7 mb-1"></i>
                                <span className="text-xs font-bold text-emerald-600 block">Export User</span>
                                <span className="text-[9px] text-gray-400">Simpan ke File Excel</span>
                            </button>
                        </div>

                        <button onClick={handleFixJoharmenSpacing} className="w-full bg-purple-500 hover:bg-purple-600 text-white py-3 rounded-xl font-bold flex justify-center items-center gap-2 transition shadow-lg mb-4">
                            <i data-lucide="wand-2" width="18"></i> Perbaiki Spasi: Joharmen Damanik
                        </button>
                    
                        <div ref={userFormRef} className={`bg-white rounded-3xl shadow-lg p-6 mb-4 border-2 transition ${editingId ? 'border-amber-300' : 'border-slate-100'}`}>
                            <h2 className="font-black text-xl mb-4 flex gap-2 items-center text-slate-700">{editingId ? <><i data-lucide="edit" className="text-orange-500"></i> Edit User: {newUser.nama || newUser.username}</> : <><i data-lucide="user-plus" className="text-blue-500"></i> Tambah User</>}</h2>
                             <div className="space-y-3">
                                 <input placeholder="Username" disabled={!!editingId} className={`w-full border-2 p-3 rounded-xl focus:outline-none focus:border-blue-400 font-bold text-slate-600 ${editingId ? 'bg-slate-100' : 'bg-white'}`} value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} />
                                <input placeholder="Password" className="w-full border-2 p-3 rounded-xl focus:outline-none focus:border-blue-400 font-bold text-slate-600" value={newUser.password} onChange={e => setNewUser({...newUser, password: e.target.value})} />
                                <input placeholder="Nama Lengkap" className="w-full border-2 p-3 rounded-xl focus:outline-none focus:border-blue-400 font-bold text-slate-600" value={newUser.nama} onChange={e => setNewUser({...newUser, nama: e.target.value})} />
                                <select className="w-full border-2 p-3 rounded-xl focus:outline-none focus:border-blue-400 font-bold text-slate-600 bg-white" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                                    <option value="petugas">Petugas</option>
                                    <option value="admin">Admin</option>
                                    <option value="pengurus">Pengurus</option>
                                    <option value="gsm">GSM</option>
                                    <option value="pembimbing">Pembimbing</option>
                                    <option value="pendeta">Pendeta</option>
                                    <option value="pmj">PMJ</option>
                                </select>
                                <div className="flex gap-2 pt-2"><button onClick={handleAddOrUpdateUser} className={`flex-1 btn-playful py-3 rounded-xl font-bold ${editingId ? 'btn-yellow' : 'btn-blue'}`}>{editingId ? 'Update / Reset' : 'Simpan User'}</button>{editingId && <button onClick={() => { setEditingId(null); setNewUser({ username: '', password: '', role: 'petugas', nama: '' }); }} className="btn-playful btn-white px-4 rounded-xl font-bold">Batal</button>}</div>
                            </div>
                        </div>
                        
                        <div className="space-y-2 pb-10">
                            <h3 className="font-black text-slate-400 ml-2 text-xs uppercase tracking-widest">User Terdaftar</h3>
                            <input type="text" placeholder="Cari username atau nama..." className="w-full p-3 rounded-xl border-2 border-slate-200 focus:outline-none focus:border-indigo-400 font-bold text-sm text-slate-700 mb-2" value={filterUser} onChange={(e) => setFilterUser(e.target.value)} />
                             {users.filter(u => (u.username || '').toLowerCase().includes(filterUser.toLowerCase()) || (u.nama || '').toLowerCase().includes(filterUser.toLowerCase())).map(u => (
                                <div key={u.username} className={`bg-white p-4 rounded-2xl shadow-sm border-2 flex justify-between items-center ${editingId === u.username ? 'border-amber-400 bg-amber-50' : 'border-slate-100'}`}>
                                    <div><p className="font-bold text-slate-700">{u.username || 'Tanpa Username'}</p><p className="text-xs font-bold text-slate-400 bg-slate-100 inline-block px-2 rounded">{u.nama || '-'} • {u.role || 'peserta'}</p></div>
                                    <div className="flex gap-2">
                                        <button onClick={() => startEditUser(u)} className="text-blue-500 bg-blue-50 p-2 rounded-lg hover:bg-blue-100 transition" title="Edit Data"><i data-lucide="pencil" width="16"></i></button>
                                        <button onClick={() => initiateAdminReset(u)} className="text-amber-500 bg-amber-50 p-2 rounded-lg hover:bg-amber-100 transition" title="Reset Password"><i data-lucide="key-round" width="16"></i></button>
                                        {u.username !== 'admin' && (<button onClick={() => initiateDelete(`users/${u.username}`)} className="text-rose-500 bg-rose-50 p-2 rounded-lg hover:bg-rose-100 transition" title="Hapus User"><i data-lucide="trash-2" width="16"></i></button>)}
                                    </div>
                                </div>
                            ))}
                              {users.filter(u => (u.username || '').toLowerCase().includes(filterUser.toLowerCase()) || (u.nama || '').toLowerCase().includes(filterUser.toLowerCase())).length === 0 && (
                                <p className="text-center text-slate-400 text-xs font-bold py-4">Tidak ada user yang cocok.</p>
                            )}
                        </div>
                    </div>
                    {deleteConfig.show && <DeleteConfirmModal />}
                    {adminResetConfig.show && <AdminResetModal config={adminResetConfig} setConfig={setAdminResetConfig} onConfirm={performAdminReset} />}
                </div>
            );
            if (view === 'generate') return (
                <div key="view-generate" className="min-h-screen bg-slate-100 p-4">
                    <div className="max-w-md mx-auto">
                        <button onClick={() => setView('admin_dashboard')} className="mb-4 btn-playful btn-white px-4 py-2 rounded-xl w-fit flex gap-2 font-bold"><i data-lucide="arrow-left"></i> Kembali</button>
                        <div className="bg-white rounded-xl shadow p-6">
                            <h2 className="font-bold text-xl mb-6 text-indigo-800 flex items-center gap-2"><i data-lucide="users"></i> SM GKPS RESORT TANGERANG</h2>
                            <div className="mb-6 space-y-4">
                                <div className="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center relative hover:bg-slate-50 transition">
                                    <input type="file" accept=".csv, .xlsx, .xls" onChange={handleCSV} className="absolute inset-0 opacity-0 cursor-pointer" />
                                    <i data-lucide="upload-cloud" className="mx-auto text-indigo-400 w-8 h-8 mb-2"></i>
                                    <span className="text-sm font-bold text-indigo-600 block">Upload CSV / Excel ke Cloud</span>
                                    <span className="text-xs text-gray-400">Kolom: Nama, Kategori, Kelas, Jenis Kelamin · Anti-duplikat (data sama akan diperbarui)</span>
                                </div>
                                <button onClick={() => setShowAddForm(!showAddForm)} className="w-full text-sm font-bold text-indigo-600 hover:bg-indigo-50 py-2 rounded transition">+ Input Manual</button>
                                {showAddForm && (
                                    <div ref={participantFormRef} className="bg-slate-50 p-4 rounded border animate-bounce-in">
                                        <h3 className="font-bold text-xs mb-2 text-gray-500 uppercase">{editingId ? 'Edit Peserta' : 'Tambah Peserta'}</h3>
                                        <input className="w-full p-2 border rounded mb-2" placeholder="Nama Lengkap" value={formData.nama} onChange={e => setFormData({...formData, nama: e.target.value})} />
                                        <select className="w-full p-2 border rounded mb-2" value={formData.kategori} onChange={e => setFormData({...formData, kategori: e.target.value})}>
                                            <option>Anak Sekolah Minggu</option><option>GSM</option><option>Panitia</option><option>Umum</option><option>Kelas</option> 
                                            <option>Pendeta</option><option>Pembimbing</option><option>Pengurus</option>
                                            <option>PMJ</option>
                                        </select>
                                        <select className="w-full p-2 border rounded mb-2" value={formData.kelas} onChange={e => setFormData({...formData, kelas: e.target.value})}>
                                            <option value="">-- Pilih Kelas --</option>{classList.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <select className="w-full p-2 border rounded mb-2" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}>
                                            <option value="">-- Jenis Kelamin --</option>
                                            <option value="L">Laki-laki</option>
                                            <option value="P">Perempuan</option>
                                        </select>
                                        <div className="flex gap-2">
                                            <button onClick={handleAddOrUpdateParticipant} className={`flex-1 text-white px-3 py-2 rounded font-bold ${editingId ? 'bg-amber-500' : 'bg-indigo-600'}`}>{editingId ? 'Update' : 'Simpan'}</button>
                                            {editingId && <button onClick={() => { setEditingId(null); setFormData({nama:'', kategori:'Anak Sekolah Minggu', kelas: '', gender: ''}); setShowAddForm(false); }} className="bg-gray-400 text-white px-3 py-2 rounded">Batal</button>}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {participants.length > 0 && (
                                <div className="space-y-3 mb-6">
                                    <button onClick={handleExportDatabase} className="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-xl font-bold flex justify-center gap-2 transition shadow-lg">
                                        <i data-lucide="file-spreadsheet" width="20"></i> Export Database ke Excel
                                    </button>
                                    <button onClick={downloadAllQR} disabled={isDownloading} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold flex justify-center gap-2 transition shadow-lg">
                                        {isDownloading ? 'Sedang Download...' : <><i data-lucide="download" width="20"></i> Download Semua QR</>}
                                    </button>
                                    <button onClick={handleMigratePersBSD} className="w-full bg-purple-500 hover:bg-purple-600 text-white py-3 rounded-xl font-bold flex justify-center gap-2 transition shadow-lg">
                                        <i data-lucide="shuffle" width="20"></i> Migrasi Nama ke Kelas GKPS-PersBSD
                                    </button>
                                </div>
                            )}
                            
                            {participants.length > 0 && (
                                <div className="mb-4 relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i data-lucide="search" width="18" className="text-slate-400"></i>
                                    </div>
                                    <input
                                        type="text"
                                        value={dbSearch}
                                        onChange={e => setDbSearch(e.target.value)}
                                        placeholder="Cari nama, kategori, atau kelas..."
                                        className="w-full pl-10 pr-10 py-3 border-2 border-slate-200 rounded-xl font-bold text-sm text-slate-700 focus:outline-none focus:border-indigo-400 transition"
                                    />
                                    {dbSearch && (
                                        <button onClick={() => setDbSearch("")} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                            <i data-lucide="x" width="18"></i>
                                        </button>
                                    )}
                                </div>
                            )}

                            {participants.length > 0 && (
                                <div className="flex gap-2 mb-4 bg-slate-100 p-1 rounded-xl">
                                    <button onClick={() => setDbViewMode('grid')} className={"flex-1 py-2 rounded-lg text-xs font-black flex items-center justify-center gap-1.5 transition " + (dbViewMode === 'grid' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600')}>
                                        <i data-lucide="layout-grid" width="14"></i> Grid QR
                                    </button>
                                    <button onClick={() => setDbViewMode('group')} className={"flex-1 py-2 rounded-lg text-xs font-black flex items-center justify-center gap-1.5 transition " + (dbViewMode === 'group' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600')}>
                                        <i data-lucide="folder-tree" width="14"></i> Per Kelompok
                                    </button>
                                </div>
                            )}

                            {(() => {
                                const q = dbSearch.trim().toLowerCase();
                                const dbList = q === '' ? participants : participants.filter(p =>
                                    (p.nama || '').toLowerCase().includes(q) ||
                                    (p.kategori || '').toLowerCase().includes(q) ||
                                    (p.kelas || '').toLowerCase().includes(q)
                                );

                                if (q !== '' && dbList.length === 0) {
                                    return (
                                        <div className="flex flex-col items-center justify-center py-10 opacity-60">
                                            <i data-lucide="search-x" className="w-10 h-10 text-slate-300 mb-2"></i>
                                            <p className="font-bold text-sm text-slate-400">Tidak ada peserta yang cocok</p>
                                        </div>
                                    );
                                }

                                // ===== MODE: PER KELOMPOK =====
                                if (dbViewMode === 'group') {
                                    const normKelas = (k) => (k && String(k).trim() && k !== '-') ? String(k).trim() : 'Tanpa Kelompok';
                                    const groups = {};
                                    dbList.forEach(p => { const k = normKelas(p.kelas); (groups[k] = groups[k] || []).push(p); });
                                    const groupNames = Object.keys(groups).sort((a, b) => {
                                        if (a === 'Tanpa Kelompok') return 1; if (b === 'Tanpa Kelompok') return -1;
                                        return a.localeCompare(b);
                                    });
                                    const labelGender = (p) => {
                                        const g = (p.gender === 'L' || p.gender === 'P') ? p.gender : genderFromName(p.nama);
                                        return g === 'L' ? 'L' : (g === 'P' ? 'P' : '');
                                    };
                                    return (
                                        <div className="space-y-3">
                                            {q !== '' && <p className="text-xs font-bold text-slate-400 ml-1">{dbList.length} hasil untuk "{dbSearch}"</p>}
                                            {groupNames.map(gName => {
                                                const members = groups[gName].slice().sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
                                                const lk = members.filter(m => labelGender(m) === 'L').length;
                                                const pr = members.filter(m => labelGender(m) === 'P').length;
                                                return (
                                                    <div key={gName} className="border border-slate-200 rounded-2xl overflow-hidden">
                                                        <div className="bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-2.5 flex items-center justify-between">
                                                            <div className="flex items-center gap-2">
                                                                <i data-lucide="users" width="16" className="text-white"></i>
                                                                <span className="font-black text-white text-sm">{gName}</span>
                                                            </div>
                                                            <span className="text-[11px] font-bold text-white/90 bg-white/20 px-2 py-0.5 rounded-full">{members.length} orang{(lk + pr) > 0 ? ` · ${lk}L/${pr}P` : ''}</span>
                                                        </div>
                                                        <div className="divide-y divide-slate-100">
                                                            {members.map((p, i) => (
                                                                <div key={p.id} className={`flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 transition ${editingId === p.id ? 'bg-amber-50' : ''}`}>
                                                                    <span className="text-[11px] font-bold text-slate-300 w-5 text-right">{i + 1}</span>
                                                                    <div className="flex-1 min-w-0">
                                                                        <p className="font-bold text-sm text-slate-800 truncate">{p.nama}</p>
                                                                        <p className="text-[10px] font-bold text-slate-400">{p.kategori}{labelGender(p) ? (labelGender(p) === 'L' ? ' · Laki-laki' : ' · Perempuan') : ''}</p>
                                                                    </div>
                                                                    <div className="flex gap-1 flex-shrink-0">
                                                                        <button onClick={() => downloadSingleQR(p)} className="text-emerald-500 bg-emerald-50 p-1.5 rounded-lg hover:bg-emerald-100"><i data-lucide="qr-code" width="14"></i></button>
                                                                        <button onClick={() => startEditParticipant(p)} className="text-blue-500 bg-blue-50 p-1.5 rounded-lg hover:bg-blue-100"><i data-lucide="pencil" width="14"></i></button>
                                                                        <button onClick={() => initiateDelete(`participants/${p.id}`)} className="text-red-500 bg-red-50 p-1.5 rounded-lg hover:bg-red-100"><i data-lucide="trash-2" width="14"></i></button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                }

                                // ===== MODE: GRID QR (default) =====
                                return (
                                <>
                                {q !== '' && (
                                    <p className="text-xs font-bold text-slate-400 mb-2 ml-1">{dbList.length} hasil ditemukan untuk "{dbSearch}"</p>
                                )}
                                <div className="grid grid-cols-2 gap-3">
                                    {dbList.map(p => (
                                        <div key={p.id} className={`border p-3 rounded text-center bg-white shadow-sm hover:shadow-md transition relative ${editingId === p.id ? 'border-amber-400 bg-amber-50' : ''}`}>
                                            <div className="absolute top-2 right-2 flex gap-1">
                                                <button onClick={() => downloadSingleQR(p)} className="text-emerald-500 bg-emerald-50 p-1 rounded hover:bg-emerald-100"><i data-lucide="download" width="12"></i></button>
                                                <button onClick={() => startEditParticipant(p)} className="text-blue-500 bg-blue-50 p-1 rounded hover:bg-blue-100"><i data-lucide="pencil" width="12"></i></button>
                                                <button onClick={() => initiateDelete(`participants/${p.id}`)} className="text-red-500 bg-red-50 p-1 rounded hover:bg-red-100"><i data-lucide="trash-2" width="12"></i></button>
                                            </div>
                                            <img src={generateQRUrl(p.id)} className="w-24 mx-auto mb-2 mix-blend-multiply cursor-pointer hover:scale-110 transition-transform duration-200 border-2 border-transparent hover:border-indigo-200 rounded-lg p-1" loading="lazy" onClick={() => downloadSingleQR(p)} title="Klik untuk download QR" />
                                            <p className="font-bold text-xs truncate text-slate-800">{p.nama}</p>
                                            <p className="text-[10px] text-gray-500 bg-gray-100 rounded px-1 inline-block mt-1">{p.kategori}</p>
                                            {p.kelas && <p className="text-sm font-black text-red-600 mt-1 uppercase tracking-tighter">{p.kelas}</p>}
                                        </div>
                                    ))}
                                </div>
                                </>
                                );
                            })()}
                        </div>
                    </div>
                    {deleteConfig.show && <DeleteConfirmModal />}
                </div>
            );
            if (view === 'my_barcode') {
                const p = participants.find(item => item.nama.toLowerCase() === safeUser.nama.toLowerCase());
                const qrId = p ? p.id : safeUser.username;
                const qrUrl = generateQRUrl(qrId);
                return (
                    <div className="min-h-screen bg-indigo-600 p-4 flex flex-col items-center justify-center relative">
                        <button onClick={handleBackToMenu} className="absolute top-6 left-6 btn-playful bg-white/20 text-white hover:bg-white/30 backdrop-blur-sm px-4 py-2 rounded-xl flex items-center gap-2 font-bold border-2 border-white/30"><i data-lucide="arrow-left" width="18"></i> Kembali</button>
                        <div className="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center animate-bounce-in relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-500"></div>
                            <div className="mb-6">
                                <h2 className="text-2xl font-black text-slate-800 font-fredoka mb-1">{safeUser.nama}</h2>
                                <span className="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">{safeUser.role}</span>
                            </div>
                            <div className="bg-slate-50 p-6 rounded-3xl border-4 border-slate-100 mb-6 relative">
                                <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white px-4 py-1 rounded-full text-[10px] font-black text-slate-400 uppercase tracking-widest border border-slate-100">Scan Me</div>
                                <img src={qrUrl} alt="QR Code" className="w-48 h-48 mx-auto mix-blend-multiply" />
                            </div>
                            <p className="text-slate-400 text-xs font-bold w-3/4 mx-auto leading-relaxed">Tunjukkan QR Code ini kepada petugas sebagai identitas.</p>
                        </div>
                    </div>
                );
            }
            
            if (view === 'manage_broadcast') return (
                <div className="min-h-screen bg-slate-50 p-4 pb-20">
                    <div className="max-w-md mx-auto">
                        <button onClick={() => setView('admin_dashboard')} className="mb-4 btn-playful btn-white px-4 py-2 rounded-xl w-fit flex gap-2 font-bold"><i data-lucide="arrow-left"></i> Kembali</button>
                        <div className="bg-white rounded-3xl shadow-lg p-6 border-2 border-indigo-100 mb-6">
                             <div className="flex items-center gap-3 mb-4 text-indigo-600">
                                <div className="bg-indigo-100 p-2 rounded-lg"><i data-lucide="megaphone" width="24"></i></div>
                                <h2 className="font-black text-xl">Buat Broadcast</h2>
                             </div>
                             <div className="space-y-3">
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Judul</label>
                                    <input className="w-full border-2 p-3 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-indigo-400" placeholder="Contoh: Pengumuman Penting" value={broadcastForm.title} onChange={e => setBroadcastForm({...broadcastForm, title: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Isi Pesan</label>
                                    <textarea className="w-full border-2 p-3 rounded-xl font-medium text-slate-600 h-28 focus:outline-none focus:border-indigo-400" placeholder="Tulis pesan lengkap disini..." value={broadcastForm.message} onChange={e => setBroadcastForm({...broadcastForm, message: e.target.value})} />
                                </div>
                                <div className="flex gap-2">
                                    <div className="flex-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Tipe</label>
                                        <select className="w-full border-2 p-3 rounded-xl font-bold text-slate-600 bg-white focus:outline-none focus:border-indigo-400" value={broadcastForm.type} onChange={e => setBroadcastForm({...broadcastForm, type: e.target.value})}>
                                            <option value="info">ℹ️ Info (Biru)</option>
                                            <option value="urgent">⚠️ Penting (Merah)</option>
                                        </select>
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Jadwal (Opsional)</label>
                                        <input type="datetime-local" className="w-full border-2 p-3 rounded-xl font-bold text-slate-600 bg-white focus:outline-none focus:border-indigo-400 text-xs" value={broadcastForm.schedule} onChange={e => setBroadcastForm({...broadcastForm, schedule: e.target.value})} />
                                    </div>
                                </div>
                                
                                <button onClick={handleSendBroadcast} className="w-full btn-playful btn-blue py-3 rounded-xl font-black text-lg shadow-lg mt-2 flex items-center justify-center gap-2">
                                    <i data-lucide="send" width="18"></i> 
                                    {broadcastForm.schedule ? 'JADWALKAN KIRIM' : 'KIRIM SEKARANG'}
                                </button>
                                {broadcastForm.schedule && <p className="text-center text-[10px] text-slate-400 font-bold">Akan muncul otomatis pada: {new Date(broadcastForm.schedule).toLocaleString('id-ID')}</p>}
                             </div>
                        </div>

                        <div>
                            <h3 className="font-black text-slate-400 ml-2 text-xs uppercase tracking-widest mb-3">Arsip / Riwayat Pesan</h3>
                            <div className="space-y-3">
                                {broadcastHistory.length === 0 ? (
                                    <div className="text-center p-8 opacity-50 border-2 border-dashed border-slate-300 rounded-xl">
                                        <p className="font-bold text-sm text-slate-400">Belum ada riwayat broadcast.</p>
                                    </div>
                                ) : (
                                    broadcastHistory.map((item) => (
                                        <div key={item.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 relative group">
                                            <button onClick={() => handleDeleteHistory(item.id)} className="absolute top-3 right-3 text-slate-300 hover:text-rose-500 transition"><i data-lucide="trash-2" width="16"></i></button>
                                            <div className="flex items-center gap-2 mb-2">
                                                <span className={`text-[10px] font-black px-2 py-1 rounded text-white ${item.type === 'urgent' ? 'bg-rose-500' : 'bg-sky-500'}`}>{item.type === 'urgent' ? 'PENTING' : 'INFO'}</span>
                                                {item.scheduledAt && <span className="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="clock" width="10"></i> Terjadwal</span>}
                                            </div>
                                            <h4 className="font-bold text-slate-800 text-sm mb-1">{item.title}</h4>
                                            <p className="text-xs text-slate-500 line-clamp-2 mb-2">{item.message}</p>
                                            <div className="flex justify-between items-center pt-2 border-t border-slate-50">
                                                <span className="text-[10px] text-slate-400 font-bold"><i data-lucide="user" width="10" className="inline mr-1"/>{item.sender}</span>
                                                <div className="text-right">
                                                    <span className="text-[10px] text-slate-400 font-bold block">{item.timestamp}</span>
                                                    {item.scheduledAt && <span className="text-[9px] text-amber-600 font-bold block">Jadwal: {new Date(item.scheduledAt).toLocaleString('id-ID')}</span>}
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
            if (view === 'spin_wheel') {
                return (
                    <SpinWheelView
                        records={liveAttendance}
                        viewDate={viewDate}
                        onBack={() => isPeserta ? handleBackToMenu() : setView('admin_dashboard')}
                    />
                );
            }

            if (view === 'change_password') return (
                <div className="min-h-screen bg-slate-50 p-4 flex items-center justify-center">
                    <div className="max-w-sm w-full bg-white p-8 rounded-3xl shadow-lg border-2 border-indigo-100 text-center">
                        <h2 className="text-xl font-black text-slate-800 mb-6">Ganti Password</h2>
                        <input type="text" className="w-full p-3 border-2 border-slate-200 rounded-xl mb-4 font-bold text-center" placeholder="Password Baru..." value={selfPassword} onChange={e => setSelfPassword(e.target.value)} />
                        <button onClick={handleChangeSelfPassword} className="w-full btn-playful btn-blue py-3 rounded-xl font-bold mb-3">Simpan Password</button>
                        <button onClick={handleBackToMenu} className="text-slate-400 font-bold text-xs">Batal</button>
                    </div>
                </div>
            );
            if (connectionError) {
                 return (
                     <div className="min-h-screen flex items-center justify-center bg-school-sunday text-center p-4">
                         <div className="bg-white p-8 rounded-3xl shadow-xl max-w-sm border-4 border-rose-100">
                            <div className="text-rose-500 mb-4"><i data-lucide="alert-octagon" width="48" height="48" className="mx-auto"></i></div>
                            <h2 className="text-xl font-black text-slate-700 mb-2">Gagal Terhubung</h2>
                            <p className="text-sm text-slate-500 mb-4 font-bold">Koneksi ke Database gagal.</p>
                            <div className="bg-slate-100 p-3 rounded-xl text-xs text-left mb-4 overflow-auto max-h-32 border border-slate-200"><code>{connectionError}</code></div>
                            <button onClick={handleSmoothRefresh} className="w-full btn-playful btn-blue py-3 rounded-xl font-bold">
                                <i data-lucide="refresh-cw" className="inline w-4 h-4 mr-2"></i> Coba Lagi (Refresh)
                            </button>
                        </div>
                    </div>
                 );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CloudAttendance />);
        // Tandai bahwa blok Babel berhasil dieksekusi sampai akhir
        window.__appScriptRan = true;
    </script>
    <script>
        // === LOADER JSX (classic runtime) ===
        // AKAR MASALAH yang sebenarnya: Babel @babel/standalone versi baru memakai
        // "automatic JSX runtime" sebagai default. Saat meng-compile <script type="text/babel">,
        // ia menyisipkan `import { jsx } from "react/jsx-runtime"` ke dalam hasil compile,
        // lalu mencoba menjalankannya sebagai script biasa -> browser menolak dengan
        // "Cannot use import statement outside a module". Itulah error di "baris 17" yang
        // muncul terus-menerus, bukan dari kode kita.
        //
        // Solusi: jangan biarkan Babel auto-memproses (script diberi type non-standar
        // "text/jsx-classic" agar diabaikan). Kita compile sendiri dengan runtime CLASSIC
        // (React.createElement) yang TIDAK menghasilkan `import`, lalu jalankan.
        (function () {
            function runApp() {
                try {
                    var src = document.getElementById('app-jsx').textContent;
                    var compiled = Babel.transform(src, {
                        presets: [['react', { runtime: 'classic' }]]
                    }).code;
                    // Jalankan hasil compile (tanpa import, aman sebagai script biasa)
                    (0, eval)(compiled);
                    window.__appScriptRan = true;
                } catch (e) {
                    console.error('Gagal menjalankan aplikasi:', e);
                    window.__lastError = (e && (e.stack || e.message)) ? (e.stack || e.message) : String(e);
                    if (window.__showFatal) {
                        window.__showFatal('Aplikasi gagal di-compile', (window.__lastError || ''));
                    }
                }
            }
            // Pastikan Babel sudah termuat sebelum compile.
            if (typeof Babel !== 'undefined') {
                runApp();
            } else {
                var tries = 0;
                var t = setInterval(function () {
                    tries++;
                    if (typeof Babel !== 'undefined') { clearInterval(t); runApp(); }
                    else if (tries > 100) { // ~10 detik
                        clearInterval(t);
                        if (window.__showFatal) window.__showFatal('Babel gagal dimuat', 'Library Babel tidak termuat dari CDN. Periksa koneksi internet.');
                    }
                }, 100);
            }
        })();
    </script>
    <script>
        // Watchdog: jika setelah 8 detik blok Babel tak pernah selesai dijalankan
        // (mis. Babel gagal meng-compile diam-diam, atau React/ReactDOM tak termuat),
        // tampilkan diagnosa alih-alih membiarkan layar kosong.
        setTimeout(function () {
            if (!window.__appScriptRan) {
                var reason = '';
                if (typeof React === 'undefined') reason += '- React tidak termuat (CDN unpkg react gagal)\n';
                if (typeof ReactDOM === 'undefined') reason += '- ReactDOM tidak termuat\n';
                if (typeof Babel === 'undefined') reason += '- Babel tidak termuat (CDN unpkg babel gagal)\n';
                if (!reason) reason = '- Blok aplikasi gagal dijalankan (kemungkinan error saat Babel meng-compile).\n  Buka Console (F12) untuk pesan "SyntaxError" dari Babel.\n';
                if (window.__showFatal) {
                    window.__showFatal('Aplikasi gagal dimulai', 'Penyebab terdeteksi:\n' + reason + (window.__resourceError ? '\nResource bermasalah: ' + window.__resourceError : ''));
                }
            }
        }, 8000);
    </script>
