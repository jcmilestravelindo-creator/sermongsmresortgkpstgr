                            <div className="text-right">
                                <h2 className="font-black text-2xl text-slate-800 font-fredoka">Dashboard</h2>
                                <p className="text-xs font-bold text-slate-400">Control Center Admin</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-3 mb-6">
                              <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm text-center">
                                <div className="text-indigo-500 mb-2 flex justify-center bg-indigo-50 p-2 rounded-full w-fit mx-auto"><i data-lucide="users" width="16"></i></div>
                                  <h3 className="font-black text-xl text-slate-700 leading-none mb-1">{totalParticipants}</h3>
                                <p className="text-[9px] font-bold text-slate-400 uppercase">Total Peserta</p>
                            </div>
                             <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm text-center">
                                <div className="text-emerald-500 mb-2 flex justify-center bg-emerald-50 p-2 rounded-full w-fit mx-auto"><i data-lucide="check-circle" width="16"></i></div>
                                <h3 className="font-black text-xl text-slate-700 leading-none mb-1">{totalHadirToday}</h3>
                                 <p className="text-[9px] font-bold text-slate-400 uppercase">Hadir Hari Ini</p>
                            </div>
                            <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm text-center">

                                <h3 className="font-black text-xl text-slate-700 leading-none mb-1">{totalUsers}</h3>
                                 <p className="text-[9px] font-bold text-slate-400 uppercase">Total Akun</p>
                            </div>
                        </div>

                        <h3 className="font-black text-slate-400 text-xs uppercase tracking-widest mb-3 ml-1 flex items-center gap-2"><i data-lucide="grid" width="12"></i> Menu Utama</h3>
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <button onClick={() => setView('attendance_manager')} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition text-left group active:scale-95">
                                <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"><i data-lucide="clipboard-check" width="24"></i></div>
                                <h4 className="font-bold text-slate-700 text-sm">Kelola Absensi</h4>
                                <p className="text-[10px] text-slate-400 font-bold mt-1">Input Manual & Sesi</p>
                             </button>

                            <button onClick={() => setView('manage_broadcast')} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition text-left group active:scale-95">
                                <div className="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"><i data-lucide="megaphone" width="24"></i></div>
                                <h4 className="font-bold text-slate-700 text-sm">Buat Broadcast</h4>
                                <p className="text-[10px] text-slate-400 font-bold mt-1">Kirim Info Penting</p>
                             </button>

                            <button onClick={() => { setEditThemeForm(themeData || defaultTheme); setView('edit_theme'); }} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition text-left group active:scale-95">
                                <div className="w-12 h-12 bg-sky-50 text-sky-600 rounded-2xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"><i data-lucide="book-open" width="24"></i></div>
                                <h4 className="font-bold text-slate-700 text-sm">Bahan Ajar</h4>
                                  <p className="text-[10px] text-slate-400 font-bold mt-1">Edit Materi Minggu</p>
                            </button>

                            <button onClick={() => { setView('scan'); setAttendanceMode(true); }} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition text-left group active:scale-95">
                                <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"><i data-lucide="scan-line" width="24"></i></div>
                                <h4 className="font-bold text-slate-700 text-sm">Scanner QR</h4>
                                  <p className="text-[10px] text-slate-400 font-bold mt-1">Mode Scan Masuk</p>
                            </button>

                            {/* FITUR BARU: AI SMART ANALYTICS */}
                             <button onClick={() => setView('ai_analytics')} className="bg-gradient-to-br from-purple-50 to-indigo-50 border border-indigo-100 p-5 rounded-3xl shadow-sm hover:shadow-md transition text-left group active:scale-95">
                                <div className="w-12 h-12 bg-indigo-500 text-white rounded-2xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform shadow-lg shadow-indigo-200"><i data-lucide="sparkles" width="24"></i></div>
                                 <h4 className="font-bold text-indigo-800 text-sm">AI Smart Analyst</h4>
                                <p className="text-[10px] text-indigo-400 font-bold mt-1">Analisa Data Cerdas</p>
                            </button>
                              
                             <button onClick={() => setView('live_report')} className="col-span-1 bg-gradient-to-r from-emerald-500 to-teal-600 p-5 rounded-3xl border border-emerald-600 shadow-lg hover:shadow-xl transition text-left group active:scale-95 relative overflow-hidden">
                                <div className="absolute right-0 top-0 w-32 h-32 bg-white/10 rounded-full -mr-10 -mt-10 blur-2xl"></div>
                                <div className="flex flex-col justify-between h-full relative z-10">
                                    <div className="bg-white/20 p-2 rounded-xl text-white w-fit mb-2"><i data-lucide="bar-chart-2" width="20"></i></div>
                                     <div>
                                         <h4 className="font-black text-white text-sm font-fredoka">Laporan Kehadiran</h4>
                                         <p className="text-[10px] text-emerald-100 font-bold mt-1">Data Realtime</p>
                                     </div>
                                </div>
                             </button>

                             <button onClick={() => setView('statistik')} className="col-span-2 bg-gradient-to-r from-violet-500 to-fuchsia-600 p-5 rounded-3xl border border-violet-600 shadow-lg hover:shadow-xl transition text-left group active:scale-95 relative overflow-hidden">
                                <div className="absolute right-0 top-0 w-40 h-40 bg-white/10 rounded-full -mr-12 -mt-12 blur-2xl"></div>
                                <div className="flex items-center gap-4 relative z-10">
                                    <div className="bg-white/20 p-3 rounded-2xl text-white"><Ico name="pie-chart" size={24} /></div>
                                    <div className="flex-1">
                                        <h4 className="font-black text-white text-base font-fredoka">Statistik & Grafik</h4>
                                        <p className="text-[10px] text-violet-100 font-bold mt-0.5">Rekap Kehadiran GSM (Grafik)</p>
                                    </div>
                                    <Ico name="chevron-right" size={20} className="text-white/70" />
                                </div>
                             </button>

                             {/* FITUR BARU: SPIN WHEEL DOORPRIZE */}
                             <button onClick={() => setView('spin_wheel')} className="col-span-2 bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 p-5 rounded-3xl border border-orange-500 shadow-lg hover:shadow-xl transition text-left group active:scale-95 relative overflow-hidden">
                                <div className="absolute right-0 top-0 w-40 h-40 bg-white/20 rounded-full -mr-12 -mt-12 blur-2xl"></div>
                                <div className="absolute left-10 bottom-0 w-24 h-24 bg-white/10 rounded-full -mb-10 blur-xl"></div>
                                <div className="flex items-center gap-4 relative z-10">
                                    <div className="bg-white/25 p-3 rounded-2xl text-white group-hover:rotate-45 transition-transform duration-500"><Ico name="ferris-wheel" size={24} /></div>
                                    <div className="flex-1">
                                        <h4 className="font-black text-white text-base font-fredoka">Spin Wheel Doorprize</h4>
                                        <p className="text-[10px] text-orange-50 font-bold mt-0.5">Undian Early Birds &amp; Jam 19–20</p>
                                    </div>
                                    <Ico name="chevron-right" size={20} className="text-white/80" />
                                </div>
                             </button>
                        </div>

                        <h3 className="font-black text-slate-400 text-xs uppercase tracking-widest mb-3 ml-1 flex items-center gap-2"><i data-lucide="settings" width="12"></i> Sistem & Data</h3>
                        <div className="space-y-3">
                            {isAdmin && (
                                <button onClick={() => setView('manage_users')} className="w-full bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4 hover:bg-slate-50 transition active:scale-95">
                                     <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center"><i data-lucide="users-cog" width="20"></i></div>
                                    <div className="text-left flex-1">
                                         <h4 className="font-bold text-slate-700 text-sm">Manajemen User</h4>
                                        <p className="text-[10px] text-slate-400 font-bold">Tambah/Edit Petugas & Admin</p>
                                    </div>
                                     <i data-lucide="chevron-right" width="16" className="text-slate-300"></i>
                                </button>
                            )}

                             {isAdmin && (
                                <button onClick={() => setView('generate')} className="w-full bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4 hover:bg-slate-50 transition active:scale-95">
                                     <div className="w-10 h-10 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center"><i data-lucide="database" width="20"></i></div>
                                    <div className="text-left flex-1">
                                        <h4 className="font-bold text-slate-700 text-sm">Database Peserta</h4>
                                          <p className="text-[10px] text-slate-400 font-bold">Import CSV/Excel & Export QR</p>
                                    </div>
                                     <i data-lucide="chevron-right" width="16" className="text-slate-300"></i>
                                </button>
                            )}

                             {isAdmin && (
                                <button onClick={() => setView('backup_restore')} className="w-full bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4 hover:bg-slate-50 transition active:scale-95">
                                     <div className="w-10 h-10 bg-teal-100 text-teal-600 rounded-xl flex items-center justify-center"><i data-lucide="database-backup" width="20"></i></div>
                                    <div className="text-left flex-1">
                                        <h4 className="font-bold text-slate-700 text-sm">Backup & Restore</h4>
                                          <p className="text-[10px] text-slate-400 font-bold">Cadangkan & Pulihkan Seluruh Data</p>
                                    </div>
                                     <i data-lucide="chevron-right" width="16" className="text-slate-300"></i>
                                </button>
                            )}

                             {(isAdmin || isPanitia) && (
                                <div className={`w-full p-4 rounded-2xl border shadow-sm flex items-center justify-between transition ${isMaintenance ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-100'}`}>
                                    <div className="flex items-center gap-4">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center transition ${isMaintenance ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                            <i data-lucide={isMaintenance ? "lock" : "unlock"} width="20"></i>
                                         </div>
                                        <div className="text-left">
                                            <h4 className={`font-bold text-sm ${isMaintenance ? 'text-amber-700' : 'text-slate-700'}`}>Maintenance Mode</h4>
                                            <p className={`text-[10px] font-bold ${isMaintenance ? 'text-amber-600' : 'text-slate-400'}`}>{isMaintenance ? 'Aplikasi Terkunci' : 'Aplikasi Terbuka'}</p>
                                        </div>
                                    </div>
                                     <label className="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" className="sr-only peer" checked={isMaintenance} onChange={() => {
                                             if (confirm(isMaintenance ? "Buka akses aplikasi?" : "Kunci aplikasi (Maintenance)?")) {
                                                saveToCloud('config/system', { maintenanceMode: !isMaintenance });
                                             }
                                        }} />
                                        <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                                    </label>
                                </div>
                            )}
                              
                            {isAdmin && (
                                <button onClick={handleResetAllData} className="w-full bg-rose-50 p-4 rounded-2xl border border-rose-100 shadow-sm flex items-center gap-4 hover:bg-rose-100 transition mt-4 active:scale-95">
                                    <div className="w-10 h-10 bg-rose-200 text-rose-600 rounded-xl flex items-center justify-center"><i data-lucide="trash-2" width="20"></i></div>
                                    <div className="text-left flex-1">
                                          <h4 className="font-bold text-rose-700 text-sm">Reset Database</h4>
                                        <p className="text-[10px] text-rose-500 font-bold">Hapus Semua Data Peserta</p>
                                     </div>
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'ai_analytics') {
                
                const generateAIAnalysis = () => {
                    setIsThinking(true);
                    setAiResponse(null);
                    
                    setTimeout(() => {
                        const total = liveAttendance.length;
                        
                        const classStats = {};
                        const categoryStats = {};
                        const statusStats = { Hadir: 0, Sakit: 0, Izin: 0, Alpha: 0 };
                        let posPICount = 0;
                        
                         liveAttendance.forEach(d => {
                            if (statusStats[d.status] !== undefined) statusStats[d.status]++;
                            
                            const cls = d.kelas || 'Tanpa Kelas';
                            classStats[cls] = (classStats[cls] || 0) + 1;
                            
                            const cat = d.kategori || 'Umum';
                            categoryStats[cat] = (categoryStats[cat] || 0) + 1;

                            if (cls.toLowerCase().includes("pos pi")) {
                                posPICount++;
                            }
                        });
                        if (total === 0) {
                            setAiResponse({ 
                                error: true, 
                                 text: `Halo ${safeUser.nama}! \n\nSaya telah memindai database untuk tanggal ${new Date(viewDate).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}. \n\nSayangnya, saya tidak menemukan data absensi sama sekali pada tanggal tersebut. Belum ada aktivitas yang terekam. Silakan lakukan absensi terlebih dahulu atau pilih tanggal lain.` 
                            });
                            setIsThinking(false);
                            return;
                        }

                        let topClass = "-";
                        let topClassCount = -1;
                        let lowClass = "-"; let lowClassCount = 9999;
                        Object.entries(classStats).forEach(([cls, count]) => {
                            if (count > topClassCount) { topClass = cls; topClassCount = count; }
                            if (count < lowClassCount) { lowClass = cls; lowClassCount = count; }
                         });

                        const countASM = categoryStats['Anak Sekolah Minggu'] || 0;
                        const countGSM = categoryStats['GSM'] || 0;
                        const ratio = countGSM > 0 ? (countASM / countGSM).toFixed(1) : countASM;
                        const hadirPct = Math.round((statusStats.Hadir / total) * 100);
                        
                        const narrative = `
                            Laporan Analisis Cerdas (${new Date(viewDate).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}):

                            📊 **Ringkasan Eksekutif:**
                            Total partisipan terdata sebanyak **${total} jiwa**.
                            Tingkat kehadiran efektif mencapai **${hadirPct}%**.

                            🏫 **Analisa Kelas & Lokasi:**
                            - Kelas Teraktif: **${topClass}** (${topClassCount} anak).
                            - Asal Pos PI: Terdeteksi **${posPICount}** peserta dari cabang Pos PI (Pekabaran Injil).
                            ${posPICount > 0 ? "Kehadiran dari Pos PI cukup signifikan, pertahankan semangat pelayanannya!" : "Belum ada data signifikan dari Pos PI hari ini."}

                            👥 **Komposisi & Pengawasan:**
                            - Anak Sekolah Minggu (ASM): ${countASM} jiwa.
                            - Guru Sekolah Minggu (GSM): ${countGSM} jiwa.
                            - Rasio Pengawasan: **1 Guru menangani ±${ratio} Anak**.
                            ${ratio > 15 ? "⚠️ Rasio cukup tinggi. Disarankan menambah personil GSM untuk efektivitas kelas." : "✅ Rasio guru dan murid sangat ideal."}

                            🩺 **Kesehatan & Kedisiplinan:**
                            - ${statusStats.Sakit > 0 ? `Terdapat ${statusStats.Sakit} anak sakit.` : `Puji Tuhan, nihil laporan sakit.`}
                            - ${statusStats.Alpha > 5 ? `⚠️ Perhatian: ${statusStats.Alpha} Alpha. Mohon tim kunjungan menindaklanjuti.` : `✅ Kedisiplinan baik (Alpha rendah).`}
                        `;
                        setAiResponse({ error: false, text: narrative, stats: statusStats, catStats: categoryStats });
                        setIsThinking(false);
                    }, 2500);
                };
                return (
                    <div className="min-h-screen bg-slate-50 p-4 pb-20 animate-bounce-in">
                        <div className="flex items-center justify-between mb-6 sticky top-0 bg-slate-50/90 backdrop-blur-md py-2 z-20">
                            <button onClick={() => setView('admin_dashboard')} className="bg-white border border-slate-200 text-slate-600 p-3 rounded-xl hover:bg-slate-100 transition shadow-sm active:scale-95"><i data-lucide="arrow-left" width="20"></i></button>
                            <div className="text-right">
                                <h2 className="font-black text-2xl text-indigo-600 font-fredoka">AI Analyst</h2>
                                 <p className="text-xs font-bold text-slate-400">Gemini-Powered Insights</p>
                            </div>
                        </div>

                         <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-lg mb-6 relative overflow-hidden">
                             <div className="absolute top-0 right-0 w-24 h-24 bg-indigo-50 rounded-full -mr-8 -mt-8 blur-xl"></div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block relative z-10">Pilih Tanggal Analisis</label>
                             <div className="flex gap-2 relative z-10">
                                <input type="date" value={viewDate} onChange={(e) => { setViewDate(e.target.value); setAiResponse(null); }} className="flex-1 bg-slate-50 p-3 rounded-xl font-bold text-slate-700 border-2 border-slate-200 focus:border-indigo-500 outline-none" />
                                <button onClick={generateAIAnalysis} disabled={isThinking} className="bg-indigo-600 text-white px-4 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                    {isThinking ? <div className="spinner w-5 h-5 border-white border-t-transparent"></div> : <><i data-lucide="sparkles" width="20"></i> Analisa</>}
                                </button>
                            </div>
                        </div>

                        {isThinking ? (
                            <div className="text-center py-12 animate-pulse">
                                <div className="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-indigo-100">
                                     <i data-lucide="loader-2" className="text-indigo-500 w-10 h-10 animate-spin"></i>
                                </div>
                                <h3 className="text-lg font-black text-slate-700">Sedang Menganalisa...</h3>
                                <p className="text-xs font-bold text-indigo-400">Gemini sedang membaca pola data...</p>
                            </div>
                        ) : aiResponse ? (
                            <div className="animate-fade-in space-y-4">
                                <div className={`bg-white p-6 rounded-3xl border-2 ${aiResponse.error ? 'border-rose-100' : 'border-indigo-100'} shadow-xl relative overflow-hidden`}>
                                     <div className="absolute top-0 right-0 p-4 opacity-10"><i data-lucide="bot" width="64" height="64"></i></div>
                                    <h3 className="font-black text-lg mb-4 flex items-center gap-2 relative z-10">
                                        <div className={`p-2 rounded-lg ${aiResponse.error ? 'bg-rose-100 text-rose-600' : 'bg-indigo-100 text-indigo-600'}`}>
                                            <i data-lucide={aiResponse.error ? "alert-circle" : "file-text"} width="20"></i>
                                         </div>
                                        Hasil Analisis
                                    </h3>
                                     <div className="text-sm font-medium text-slate-600 leading-relaxed whitespace-pre-line typing-cursor relative z-10 font-sans">
                                        {aiResponse.text}
                                    </div>
                                </div>

                                {!aiResponse.error && (
                                     <>
                                    <div className="grid grid-cols-2 gap-3">
                                         <div className="bg-white p-4 rounded-2xl border border-emerald-100 text-center shadow-sm">
                                            <span className="text-3xl font-black text-emerald-500 block font-fredoka">{aiResponse.stats.Hadir}</span>
                                             <span className="text-[10px] font-bold text-slate-400 uppercase">Hadir</span>
                                        </div>
                                         <div className="bg-white p-4 rounded-2xl border border-blue-100 text-center shadow-sm">
                                            <span className="text-3xl font-black text-blue-500 block font-fredoka">{aiResponse.stats.Sakit}</span>
                                             <span className="text-[10px] font-bold text-slate-400 uppercase">Sakit</span>
                                        </div>
                                        <div className="bg-white p-4 rounded-2xl border border-orange-100 text-center shadow-sm">
                                             <span className="text-3xl font-black text-orange-500 block font-fredoka">{aiResponse.stats.Izin}</span>
                                            <span className="text-[10px] font-bold text-slate-400 uppercase">Izin</span>
                                         </div>
                                        <div className="bg-white p-4 rounded-2xl border border-rose-100 text-center shadow-sm">
                                             <span className="text-3xl font-black text-rose-500 block font-fredoka">{aiResponse.stats.Alpha}</span>
                                            <span className="text-[10px] font-bold text-slate-400 uppercase">Alpha</span>
                                         </div>
                                    </div>

                                     {aiResponse.catStats && (
                                        <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-lg mt-2">
                                             <h4 className="text-xs font-black text-slate-400 uppercase mb-3 flex items-center gap-2"><i data-lucide="pie-chart" width="14"></i> Komposisi Peserta</h4>
                                            <div className="space-y-2">
                                                 {Object.entries(aiResponse.catStats).map(([key, val]) => (
                                                    <div key={key} className="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                        <span className="text-xs font-bold text-slate-600">{key}</span>
                                                        <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded">{val} Jiwa</span>
                                                    </div>
                                                 ))}
                                            </div>
                                        </div>
                                     )}
                                    </>
                                )}
                            </div>
                        ) : (
                            <div className="text-center py-12 opacity-60">
                                 <div className="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm">
                                    <i data-lucide="search" className="w-10 h-10 text-slate-300"></i>
                                 </div>
                                <h3 className="font-black text-slate-400 text-sm">Menunggu Perintah</h3>
                                <p className="text-[10px] text-slate-400 mt-1 font-bold">Pilih tanggal lalu tekan tombol Analisa.</p>
                             </div>
                        )}
                    </div>
                );
            }
            
            if (view === 'attendance_manager') {
                let filteredParticipants = [];
                if (isPeserta) {
                    const mySelf = participants.find(p => p.nama.toLowerCase() === safeUser.nama.toLowerCase());
                    if (mySelf) filteredParticipants = [mySelf];
                } else {
                    filteredParticipants = participants.filter(p => p.nama.toLowerCase().includes(filterManual.toLowerCase()));
                }

                return (
                    <div className="min-h-screen bg-slate-50 relative">
                        <div className="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm p-4">
                            <div className="flex items-center gap-3 mb-4">
                                <button onClick={() => isPeserta ? handleBackToMenu() : setView('admin_dashboard')} className="bg-slate-100 p-2 rounded-xl hover:bg-slate-200"><i data-lucide="arrow-left" width="20"></i></button>
                                <h2 className="font-black text-xl text-slate-800">Kelola Absensi</h2>
                             </div>
                            
                            {!isPeserta && (
                                <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <span className="font-bold text-sm text-indigo-800">Mode Otomatis</span>
                                         <label className="relative inline-flex items-center cursor-pointer">
                                            <input type="checkbox" className="sr-only peer" checked={sessionConfig.autoMode} onChange={e => setSessionConfig({...sessionConfig, autoMode: e.target.checked})} />
                                            <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                                        </label>
                                     </div>
                                    
                                     {sessionConfig.autoMode ? (
                                        <div className="flex gap-2">
                                            <div className="flex-1"><label className="text-[10px] font-bold text-slate-400">Buka</label><input type="time" className="w-full p-2 rounded border font-bold text-slate-700" value={sessionConfig.openTime} onChange={e => setSessionConfig({...sessionConfig, openTime: e.target.value})} /></div>
                                            <div className="flex-1"><label className="text-[10px] font-bold text-slate-400">Tutup</label><input type="time" className="w-full p-2 rounded border font-bold text-slate-700" value={sessionConfig.closeTime} onChange={e => setSessionConfig({...sessionConfig, closeTime: e.target.value})} /></div>
                                         </div>
                                    ) : (
                                        <div className="flex items-center justify-between bg-white p-3 rounded-lg border">
                                             <span className="font-bold text-sm text-slate-600">Status Absensi</span>
                                            <button onClick={() => setSessionConfig({...sessionConfig, isOpen: !sessionConfig.isOpen})} className={`px-4 py-1.5 rounded-lg text-xs font-black text-white ${sessionConfig.isOpen ? 'bg-emerald-500' : 'bg-red-500'}`}>{sessionConfig.isOpen ? 'DIBUKA' : 'DITUTUP'}</button>
                                        </div>
                                    )}
                                     <button onClick={handleSaveConfig} className="w-full bg-indigo-600 text-white text-xs font-bold py-3 rounded-lg hover:bg-indigo-700 shadow-lg shadow-indigo-200">Simpan Pengaturan</button>
                                </div>
                            )}

                              {!isPeserta && (
                                <input className="w-full p-3 rounded-xl border-2 border-slate-200 focus:outline-none focus:border-indigo-400 font-bold text-sm text-slate-700" placeholder="Cari Nama Peserta..." value={filterManual} onChange={e => setFilterManual(e.target.value)} />
                            )}
                        </div>

                        <div className="p-4 pb-20 space-y-3">
                            {filteredParticipants.length === 0 && isPeserta ? (
                                <div className="text-center p-8 opacity-50">
                                    <i data-lucide="user-x" className="mx-auto w-12 h-12 mb-2"></i>
                                    <p className="font-bold text-sm">Data peserta Anda belum terdaftar di database.</p>
                                </div>
                            ) : (
                                 filteredParticipants.map(p => {
                                    const statusData = liveAttendance.find(l => l.id === p.id);
                                    return (
                                        <div key={p.id} className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm animate-bounce-in">
                                            <div className="flex justify-between items-start mb-3">
                                                <div><h4 className="font-bold text-slate-800">{p.nama}</h4><p className="text-xs text-slate-500 font-bold">{p.kategori} • {p.kelas || '-'}</p></div>
                                                {statusData && <span className={`text-[10px] font-black px-2 py-1 rounded text-white ${statusData.status === 'Hadir' ? 'bg-emerald-500' : statusData.status === 'Sakit' ? 'bg-blue-500' : statusData.status === 'Izin' ? 'bg-orange-500' : 'bg-red-500'}`}>{statusData.status}</span>}
                                            </div>
                                            <div className="grid grid-cols-4 gap-2">
                                                 <button onClick={() => handleManualAttendance(p, 'Hadir')} className="bg-emerald-50 text-emerald-600 border-b-2 border-emerald-200 hover:bg-emerald-100 py-2 rounded-lg text-xs font-bold">Hadir</button>
                                                 <button onClick={() => handleManualAttendance(p, 'Izin')} className="bg-orange-50 text-orange-600 border-b-2 border-orange-200 hover:bg-orange-100 py-2 rounded-lg text-xs font-bold">Izin</button>
                                                <button onClick={() => handleManualAttendance(p, 'Sakit')} className="bg-blue-50 text-blue-600 border-b-2 border-blue-200 hover:bg-blue-100 py-2 rounded-lg text-xs font-bold">Sakit</button>
                                                <button onClick={() => handleManualAttendance(p, 'Alpha')} className="bg-red-50 text-red-600 border-b-2 border-red-200 hover:bg-red-100 py-2 rounded-lg text-xs font-bold">Alpha</button>
                                            </div>
                                         </div>
                                    )
                                })
                              )}
                        </div>
                    </div>
                );
            }

            if (view === 'statistik') {
                // === REKAP KEHADIRAN GSM (GRAFIK) ===
                // Sumber data: liveAttendance = catatan absensi pada tanggal viewDate.
                // "Asal Gereja" pada aplikasi ini direpresentasikan oleh field `kelas`
                // (kelompok / Pos / Resort tempat GSM bertugas).

                const norm = (v) => (v && String(v).trim() && v !== '-') ? String(v).trim() : 'Tanpa Kelompok';

                // Daftar GSM hadir (status Hadir) vs tidak hadir (Izin/Sakit/Alpha)
                const hadirRecords = liveAttendance.filter(r => r.status === 'Hadir');
                const tidakHadirRecords = liveAttendance.filter(r => r.status && r.status !== 'Hadir');

                // GSM yang belum tercatat sama sekali = participants - yang ada di liveAttendance
                const recordedIds = new Set(liveAttendance.map(r => r.id));
                const belumTercatat = participants.filter(p => !recordedIds.has(p.id));

                const totalGSM = participants.length;
                const totalHadir = hadirRecords.length;
                const totalTidakHadir = tidakHadirRecords.length;
                const totalBelum = belumTercatat.length;
                const hadirPct = totalGSM > 0 ? Math.round((totalHadir / totalGSM) * 100) : 0;

                // Helper filter kelompok (didefinisikan lebih awal agar bisa dipakai dashboard)
                const passChurchKelas = (kelas) => statChurchFilter === 'Semua' || norm(kelas) === statChurchFilter;
                const passChurchSafe = (rec) => passChurchKelas(rec.kelas);

                // === Data tambahan untuk DASHBOARD ===
                // Peta id peserta -> gender (untuk catatan lama yang belum simpan gender)
                const genderOf = (rec) => {
                    if (rec.gender === 'L' || rec.gender === 'P') return rec.gender;
                    const p = participants.find(pp => pp.id === rec.id);
                    if (p && (p.gender === 'L' || p.gender === 'P')) return p.gender;
                    return genderFromName(rec.nama || (p && p.nama));
                };
                // Komposisi status (untuk donat)
                const statusComposition = [
                    { label: 'Hadir', value: liveAttendance.filter(r => r.status === 'Hadir' && passChurchSafe(r)).length, color: '#10b981' },
                    { label: 'Izin', value: liveAttendance.filter(r => r.status === 'Izin' && passChurchSafe(r)).length, color: '#f97316' },
                    { label: 'Sakit', value: liveAttendance.filter(r => r.status === 'Sakit' && passChurchSafe(r)).length, color: '#3b82f6' },
                    { label: 'Alpha', value: liveAttendance.filter(r => r.status === 'Alpha' && passChurchSafe(r)).length, color: '#ef4444' },
                    { label: 'Belum', value: belumTercatat.filter(p => passChurchKelas(p.kelas)).length, color: '#cbd5e1' },
                ];
                // Statistik gender (di antara yang HADIR)
                const hadirFiltered = hadirRecords.filter(r => passChurchSafe(r));
                const genL = hadirFiltered.filter(r => genderOf(r) === 'L').length;
                const genP = hadirFiltered.filter(r => genderOf(r) === 'P').length;
                const genU = hadirFiltered.filter(r => genderOf(r) === '?').length;
                // Gender di seluruh peserta terdaftar (untuk konteks)
                const allL = participants.filter(p => resolveGender(p) === 'L').length;
                const allP = participants.filter(p => resolveGender(p) === 'P').length;
                // Distribusi jam check-in
                const hourMap = {};
                hadirFiltered.forEach(r => { if (r.jam) { const h = String(r.jam).split(':')[0].padStart(2, '0') + ':00'; hourMap[h] = (hourMap[h] || 0) + 1; } });
                const hourSeries = Object.keys(hourMap).sort().map(k => ({ label: k, value: hourMap[k] }));
                // Per kelompok (hadir)
                const churchMap = {};
                hadirFiltered.forEach(r => { const k = norm(r.kelas); churchMap[k] = (churchMap[k] || 0) + 1; });
                const churchSeries = Object.keys(churchMap).map(k => ({ label: k, value: churchMap[k] })).sort((a, b) => b.value - a.value);

                // Daftar gereja/kelompok untuk filter
                const churchSet = Array.from(new Set([
                    ...liveAttendance.map(r => norm(r.kelas)),
                    ...participants.map(p => norm(p.kelas))
                ])).sort();

                // Terapkan filter asal gereja
                const passChurch = (kelas) => statChurchFilter === 'Semua' || norm(kelas) === statChurchFilter;

                // === Bangun data grafik sesuai mode pengelompokan ===
                let chartData = [];
                let chartTitle = "";
                let chartSubtitle = "";

                if (statGroupBy === 'status') {
                    chartTitle = "Berdasarkan Status Kehadiran";
                    chartSubtitle = statChurchFilter === 'Semua' ? "Seluruh GSM" : "Kelompok: " + statChurchFilter;
                    const buckets = { 'Hadir': 0, 'Izin': 0, 'Sakit': 0, 'Alpha': 0 };
                    liveAttendance.forEach(r => {
                        if (!passChurch(r.kelas)) return;
                        if (buckets[r.status] === undefined) buckets[r.status] = 0;
                        buckets[r.status]++;
                    });
                    // Belum Absen (hanya saat tanpa filter gereja, atau cocok filter)
                    let belumCount = belumTercatat.filter(p => passChurch(p.kelas)).length;
                    const colorMap = { 'Hadir': '#10b981', 'Izin': '#f97316', 'Sakit': '#3b82f6', 'Alpha': '#ef4444' };
                    chartData = Object.keys(buckets).map(k => ({ label: k, value: buckets[k], color: colorMap[k] || '#64748b' }));
                    chartData.push({ label: 'Belum Absen', value: belumCount, color: '#94a3b8' });
                } else if (statGroupBy === 'gereja') {
                    chartTitle = "Berdasarkan Asal Gereja / Kelompok";
                    chartSubtitle = "Jumlah GSM yang Hadir per Kelompok";
                    const map = {};
                    hadirRecords.forEach(r => {
                        if (!passChurch(r.kelas)) return;
                        const key = norm(r.kelas);
                        map[key] = (map[key] || 0) + 1;
                    });
                    const palette = ['#8b5cf6','#ec4899','#06b6d4','#10b981','#f59e0b','#ef4444','#6366f1','#14b8a6','#f43f5e','#84cc16','#a855f7','#0ea5e9'];
                    chartData = Object.keys(map).map((k, i) => ({ label: k, value: map[k], color: palette[i % palette.length] }));
                } else if (statGroupBy === 'jam') {
                    chartTitle = "Berdasarkan Waktu Check-in";
                    chartSubtitle = "Distribusi Jam Kehadiran (GSM Hadir)";
                    const map = {};
                    hadirRecords.forEach(r => {
                        if (!passChurch(r.kelas)) return;
                        if (!r.jam) return;
                        const hour = String(r.jam).split(':')[0].padStart(2, '0');
                        const key = hour + ":00";
                        map[key] = (map[key] || 0) + 1;
                    });
                    chartData = Object.keys(map).sort().map((k, i) => ({ label: k, value: map[k], color: '#0ea5e9' }));
                }

                // Urutkan (kecuali mode jam yang sudah urut waktu, tetap bisa di-sort jumlah)
                if (statGroupBy === 'jam' && statSort === 'time') {
                    // sudah urut waktu
                } else {
                    chartData = [...chartData].sort((a, b) => statSort === 'asc' ? a.value - b.value : b.value - a.value);
                }

                const maxVal = Math.max(1, ...chartData.map(d => d.value));
                const totalChart = chartData.reduce((s, d) => s + d.value, 0);

                const StatCard = ({ icon, value, label, color }) => (
                    <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
                        <div className={"w-9 h-9 rounded-xl flex items-center justify-center mb-1.5 " + color}><Ico name={icon} size={18} /></div>
                        <span className="text-xl font-black text-slate-800 leading-none font-fredoka">{value}</span>
                        <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wide mt-1">{label}</span>
                    </div>
                );

                // ====== KOMPONEN GRAFIK SVG ESTETIK (tanpa library) ======
                const polar = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
                const arcPath = (cx, cy, rO, rI, start, end) => {
                    const [x1, y1] = polar(cx, cy, rO, end); const [x2, y2] = polar(cx, cy, rO, start);
                    const [x3, y3] = polar(cx, cy, rI, start); const [x4, y4] = polar(cx, cy, rI, end);
                    const large = end - start <= 180 ? 0 : 1;
                    return `M ${x1} ${y1} A ${rO} ${rO} 0 ${large} 0 ${x2} ${y2} L ${x3} ${y3} A ${rI} ${rI} 0 ${large} 1 ${x4} ${y4} Z`;
                };
                // Gauge setengah lingkaran untuk tingkat kehadiran
                const Gauge = ({ pct }) => {
                    const cx = 90, cy = 90, rO = 78, rI = 56;
                    const end = -90 + (pct / 100) * 180;
                    return (
                        <svg viewBox="0 0 180 110" className="w-full" style={{ maxHeight: 140 }}>
                            <defs>
                                <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor="#7c3aed" /><stop offset="100%" stopColor="#2563eb" />
                                </linearGradient>
                            </defs>
                            <path d={arcPath(cx, cy, rO, rI, -90, 90)} fill="#eef2ff" />
                            {pct > 0 && <path d={arcPath(cx, cy, rO, rI, -90, end)} fill="url(#gaugeGrad)" />}
                            <text x={cx} y={cy - 12} textAnchor="middle" className="font-fredoka" style={{ fontSize: 30, fontWeight: 800, fill: '#1e293b' }}>{pct}%</text>
                            <text x={cx} y={cy + 6} textAnchor="middle" style={{ fontSize: 10, fontWeight: 700, fill: '#94a3b8' }}>KEHADIRAN</text>
                        </svg>
                    );
                };
                // Donat komposisi status
                const Donut = ({ parts }) => {
                    const total = parts.reduce((s, p) => s + p.value, 0);
                    const cx = 80, cy = 80, rO = 72, rI = 46;
                    let acc = 0;
                    return (
                        <div className="flex items-center gap-4">
                            <svg viewBox="0 0 160 160" style={{ width: 140, height: 140, flexShrink: 0 }}>
                                {total === 0 ? <circle cx={cx} cy={cy} r={(rO + rI) / 2} fill="none" stroke="#eef2ff" strokeWidth={rO - rI} /> :
                                    parts.filter(p => p.value > 0).map((p, i) => {
                                        const start = (acc / total) * 360; acc += p.value; const end = (acc / total) * 360;
                                        return <path key={i} d={arcPath(cx, cy, rO, rI, start, end === 360 ? 359.99 : end)} fill={p.color} />;
                                    })}
                                <text x={cx} y={cy - 4} textAnchor="middle" className="font-fredoka" style={{ fontSize: 26, fontWeight: 800, fill: '#1e293b' }}>{total}</text>
                                <text x={cx} y={cy + 14} textAnchor="middle" style={{ fontSize: 9, fontWeight: 700, fill: '#94a3b8' }}>TOTAL</text>
                            </svg>
                            <div className="flex-1 space-y-1.5">
                                {parts.map((p, i) => {
                                    const pct = total > 0 ? Math.round((p.value / total) * 100) : 0;
                                    return (
                                        <div key={i} className="flex items-center gap-2">
                                            <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ backgroundColor: p.color }}></span>
                                            <span className="text-xs font-bold text-slate-600 flex-1">{p.label}</span>
                                            <span className="text-xs font-black text-slate-800">{p.value}</span>
                                            <span className="text-[10px] font-bold text-slate-400 w-9 text-right">{pct}%</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    );
                };
                // Visual gender Laki vs Perempuan
                const GenderSplit = ({ l, p, u }) => {
                    const tot = l + p + u || 1;
                    const lPct = Math.round((l / tot) * 100), pPct = Math.round((p / tot) * 100);
                    return (
                        <div>
                            <div className="flex items-end justify-around mb-3">
                                <div className="flex flex-col items-center">
                                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-200 mb-1">
                                        <Ico name="user" size={30} className="text-white" />
                                    </div>
                                    <span className="text-2xl font-black text-slate-800 font-fredoka leading-none">{l}</span>
                                    <span className="text-[10px] font-bold text-blue-500">Laki-laki</span>
                                </div>
                                <div className="text-slate-300 font-black text-lg pb-6">vs</div>
                                <div className="flex flex-col items-center">
                                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-600 flex items-center justify-center shadow-lg shadow-pink-200 mb-1">
                                        <Ico name="user" size={30} className="text-white" />
                                    </div>
                                    <span className="text-2xl font-black text-slate-800 font-fredoka leading-none">{p}</span>
                                    <span className="text-[10px] font-bold text-pink-500">Perempuan</span>
                                </div>
                            </div>
                            <div className="w-full h-4 rounded-full overflow-hidden flex bg-slate-100">
                                <div className="h-full bg-gradient-to-r from-sky-400 to-blue-600 flex items-center justify-center" style={{ width: lPct + '%' }}>
                                    {lPct >= 12 && <span className="text-[9px] font-black text-white">{lPct}%</span>}
                                </div>
                                <div className="h-full bg-gradient-to-r from-pink-400 to-rose-600 flex items-center justify-center" style={{ width: pPct + '%' }}>
                                    {pPct >= 12 && <span className="text-[9px] font-black text-white">{pPct}%</span>}
                                </div>
                            </div>
                            {u > 0 && <p className="text-[10px] text-slate-400 font-bold text-center mt-2">{u} GSM hadir belum punya data jenis kelamin — lengkapi di menu Peserta</p>}
                        </div>
                    );
                };
                // Bar chart estetik horizontal
                const FancyBars = ({ data, max, gradientId }) => (
                    <div className="space-y-2.5">
                        {data.length === 0 ? (
                            <div className="flex flex-col items-center justify-center py-6 opacity-50">
                                <Ico name="bar-chart-2" size={36} className="text-slate-300 mb-2" />
                                <p className="font-bold text-xs text-slate-400">Belum ada data</p>
                            </div>
                        ) : data.map((d, i) => {
                            const w = Math.round((d.value / max) * 100);
                            return (
                                <div key={i}>
                                    <div className="flex items-center justify-between mb-1">
                                        <span className="text-xs font-bold text-slate-600 truncate">{d.label}</span>
                                        <span className="text-xs font-black text-slate-800">{d.value}</span>
                                    </div>
                                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full rounded-full transition-all duration-700" style={{ width: Math.max(w, d.value > 0 ? 6 : 0) + '%', background: d.color || 'linear-gradient(90deg,#7c3aed,#2563eb)' }}></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
                // Sparkline batang untuk jam check-in
                const HourBars = ({ series }) => {
                    const max = Math.max(1, ...series.map(s => s.value));
                    return (
                        <div className="flex items-end justify-between gap-1.5 h-28">
                            {series.length === 0 ? <p className="text-xs font-bold text-slate-400 m-auto">Belum ada check-in</p> :
                                series.map((s, i) => (
                                    <div key={i} className="flex-1 flex flex-col items-center gap-1">
                                        <span className="text-[9px] font-black text-slate-500">{s.value}</span>
                                        <div className="w-full rounded-t-lg bg-gradient-to-t from-cyan-500 to-sky-400" style={{ height: Math.max(6, (s.value / max) * 80) + 'px' }}></div>
                                        <span className="text-[8px] font-bold text-slate-400">{s.label.slice(0, 2)}</span>
                                    </div>
                                ))}
                        </div>
                    );
                };

                return (
                <div className="min-h-screen bg-slate-50 relative flex flex-col">
                    <div className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
                        <div className="p-4 pb-3 flex items-center gap-3">
                            <button onClick={() => isPeserta ? handleBackToMenu() : setView('admin_dashboard')} className="bg-slate-100 text-slate-600 p-2 rounded-xl font-bold border-b-2 border-slate-300 hover:bg-slate-200 transition active:scale-95">
                                <Ico name="arrow-left" size={20} />
                            </button>
                            <div className="flex-1">
                                <h2 className="font-black text-lg text-slate-800 leading-none font-fredoka">Statistik Kehadiran</h2>
                                <p className="text-[10px] font-bold text-slate-400 mt-0.5">Rekap GSM Sermon Resort Tangerang</p>
                            </div>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                    <Ico name="calendar" size={12} className="text-slate-400" />
                                </div>
                                <input type="date" value={viewDate} onChange={(e) => setViewDate(e.target.value)} className="bg-slate-100 text-slate-700 text-[11px] font-bold py-2 pl-7 pr-2 rounded-xl border-transparent focus:bg-white focus:border-violet-400 focus:ring-0 transition" />
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 p-4 pb-24 overflow-y-auto space-y-4">
                        {/* Ringkasan Kartu */}
                        <div className="grid grid-cols-4 gap-2.5">
                            <StatCard icon="users" value={totalGSM} label="Total GSM" color="bg-slate-100 text-slate-600" />
                            <StatCard icon="user-check" value={totalHadir} label="Hadir" color="bg-emerald-100 text-emerald-600" />
                            <StatCard icon="user-x" value={totalTidakHadir} label="Tdk Hadir" color="bg-rose-100 text-rose-600" />
                            <StatCard icon="help-circle" value={totalBelum} label="Belum Absen" color="bg-amber-100 text-amber-600" />
                        </div>

                        {/* DASHBOARD: Gauge + Donut */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <div className="flex items-center gap-2 mb-1">
                                    <div className="w-7 h-7 bg-violet-100 text-violet-600 rounded-lg flex items-center justify-center"><Ico name="pie-chart" size={14} /></div>
                                    <span className="text-xs font-black text-slate-600 uppercase tracking-wide">Tingkat Kehadiran</span>
                                </div>
                                <Gauge pct={hadirPct} />
                                <p className="text-[11px] font-bold text-slate-400 text-center -mt-1">{totalHadir} dari {totalGSM} GSM tercatat hadir</p>
                            </div>
                            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <div className="flex items-center gap-2 mb-3">
                                    <div className="w-7 h-7 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center"><Ico name="list-checks" size={14} /></div>
                                    <span className="text-xs font-black text-slate-600 uppercase tracking-wide">Komposisi Status</span>
                                </div>
                                <Donut parts={statusComposition} />
                            </div>
                        </div>

                        {/* DASHBOARD: Statistik Gender */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                            <div className="flex items-center gap-2 mb-3">
                                <div className="w-7 h-7 bg-pink-100 text-pink-600 rounded-lg flex items-center justify-center"><Ico name="venus-mars" size={14} /></div>
                                <div>
                                    <span className="text-xs font-black text-slate-600 uppercase tracking-wide">Statistik Jenis Kelamin</span>
                                    <p className="text-[10px] font-bold text-slate-400">GSM yang hadir{statChurchFilter !== 'Semua' ? ' · ' + statChurchFilter : ''}</p>
                                </div>
                            </div>
                            <GenderSplit l={genL} p={genP} u={genU} />
                            {(allL > 0 || allP > 0) && (
                                <div className="mt-3 pt-3 border-t border-slate-100 flex justify-around text-center">
                                    <div><span className="text-sm font-black text-blue-600 font-fredoka">{allL}</span><p className="text-[9px] font-bold text-slate-400">L Terdaftar</p></div>
                                    <div><span className="text-sm font-black text-pink-600 font-fredoka">{allP}</span><p className="text-[9px] font-bold text-slate-400">P Terdaftar</p></div>
                                    <div><span className="text-sm font-black text-slate-600 font-fredoka">{participants.length}</span><p className="text-[9px] font-bold text-slate-400">Total GSM</p></div>
                                </div>
                            )}
                        </div>

                        {/* DASHBOARD: distribusi jam + per kelompok ringkas */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <div className="flex items-center gap-2 mb-3">
                                    <div className="w-7 h-7 bg-cyan-100 text-cyan-600 rounded-lg flex items-center justify-center"><Ico name="clock" size={14} /></div>
                                    <span className="text-xs font-black text-slate-600 uppercase tracking-wide">Distribusi Jam Check-in</span>
                                </div>
                                <HourBars series={hourSeries} />
                            </div>
                            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <div className="flex items-center gap-2 mb-3">
                                    <div className="w-7 h-7 bg-violet-100 text-violet-600 rounded-lg flex items-center justify-center"><Ico name="church" size={14} /></div>
                                    <span className="text-xs font-black text-slate-600 uppercase tracking-wide">Hadir per Kelompok</span>
                                </div>
                                <FancyBars data={churchSeries.slice(0, 6)} max={Math.max(1, ...churchSeries.map(d => d.value))} />
                            </div>
                        </div>

                        {/* FILTER: Kelompokkan berdasarkan */}
                        <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                            <div>
                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Kelompokkan Berdasarkan</label>
                                <div className="grid grid-cols-3 gap-2 mt-1.5">
                                    {[
                                        { key: 'status', label: 'Jumlah Hadir', icon: 'list-checks' },
                                        { key: 'gereja', label: 'Asal Gereja', icon: 'church' },
                                        { key: 'jam', label: 'Waktu Check-in', icon: 'clock' }
                                    ].map(opt => (
                                        <button key={opt.key} onClick={() => setStatGroupBy(opt.key)} className={"flex flex-col items-center gap-1 py-2.5 rounded-xl text-[10px] font-black border-2 transition active:scale-95 " + (statGroupBy === opt.key ? 'bg-violet-500 text-white border-violet-600 shadow-md shadow-violet-200' : 'bg-slate-50 text-slate-500 border-slate-100 hover:bg-slate-100')}>
                                            <Ico name={opt.icon} size={16} />
                                            <span>{opt.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex gap-2">
                                {/* Filter Asal Gereja */}
                                <div className="relative flex-1">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Filter Kelompok</label>
                                    <div className="relative mt-1">
                                        <select value={statChurchFilter} onChange={(e) => setStatChurchFilter(e.target.value)} className="w-full bg-slate-50 border-2 border-slate-100 text-slate-600 text-xs font-bold py-2.5 pl-3 pr-7 rounded-xl focus:outline-none focus:border-violet-400 appearance-none">
                                            <option value="Semua">Semua Kelompok</option>
                                            {churchSet.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                                            <Ico name="chevron-down" size={14} className="text-slate-400" />
                                        </div>
                                    </div>
                                </div>
                                {/* Urutan */}
                                <div className="relative flex-1">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Urutkan</label>
                                    <div className="relative mt-1">
                                        <select value={statSort} onChange={(e) => setStatSort(e.target.value)} className="w-full bg-slate-50 border-2 border-slate-100 text-slate-600 text-xs font-bold py-2.5 pl-3 pr-7 rounded-xl focus:outline-none focus:border-violet-400 appearance-none">
                                            <option value="desc">Terbanyak → Sedikit</option>
                                            <option value="asc">Sedikit → Terbanyak</option>
                                            {statGroupBy === 'jam' && <option value="time">Urut Waktu</option>}
                                        </select>
                                        <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                                            <Ico name="chevron-down" size={14} className="text-slate-400" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* GRAFIK BATANG */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                            <div className="flex items-center gap-2 mb-1">
                                <div className="w-8 h-8 bg-violet-100 text-violet-600 rounded-lg flex items-center justify-center"><Ico name="bar-chart-3" size={16} /></div>
                                <div>
                                    <h3 className="font-black text-slate-700 text-sm leading-none font-fredoka">{chartTitle}</h3>
                                    <p className="text-[10px] font-bold text-slate-400 mt-0.5">{chartSubtitle}</p>
                                </div>
                            </div>

                            <div className="mt-4 space-y-3">
                                {chartData.length === 0 || totalChart === 0 ? (
                                    <div className="flex flex-col items-center justify-center py-8 opacity-50">
                                        <Ico name="bar-chart-2" size={40} className="text-slate-300 mb-2" />
                                        <p className="font-bold text-xs text-slate-400">Belum ada data untuk ditampilkan</p>
                                    </div>
                                ) : chartData.map((d, idx) => {
                                    const pct = Math.round((d.value / maxVal) * 100);
                                    const sharePct = totalChart > 0 ? Math.round((d.value / totalChart) * 100) : 0;
                                    return (
                                        <div key={idx} className="animate-fade-in">
                                            <div className="flex items-center justify-between mb-1">
                                                <div className="flex items-center gap-2 min-w-0">
                                                    <span className="text-[10px] font-black text-slate-400 w-4">{idx + 1}.</span>
                                                    <span className="text-xs font-bold text-slate-700 truncate">{d.label}</span>
                                                </div>
                                                <div className="flex items-center gap-1.5 flex-shrink-0">
                                                    <span className="text-sm font-black text-slate-800 font-fredoka">{d.value}</span>
                                                    <span className="text-[9px] font-bold text-slate-400">({sharePct}%)</span>
                                                </div>
                                            </div>
                                            <div className="w-full h-5 bg-slate-100 rounded-lg overflow-hidden">
                                                <div className="h-full rounded-lg transition-all duration-700 flex items-center justify-end pr-1.5" style={{ width: Math.max(pct, d.value > 0 ? 8 : 0) + '%', backgroundColor: d.color }}>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Daftar GSM Tidak Hadir / Belum Absen */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-700 text-sm mb-3 flex items-center gap-2 font-fredoka"><Ico name="user-x" size={16} className="text-rose-500" /> GSM Belum / Tidak Hadir</h3>
                            {tidakHadirRecords.filter(r => passChurch(r.kelas)).length === 0 && belumTercatat.filter(p => passChurch(p.kelas)).length === 0 ? (
                                <p className="text-xs font-bold text-emerald-500 text-center py-3">🎉 Semua GSM hadir!</p>
                            ) : (
                                <div className="space-y-2">
                                    {tidakHadirRecords.filter(r => passChurch(r.kelas)).map((r, i) => (
                                        <div key={'th'+i} className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl">
                                            <div className="min-w-0">
                                                <p className="text-xs font-bold text-slate-700 truncate">{r.nama}</p>
                                                <p className="text-[10px] font-bold text-slate-400">{norm(r.kelas)}</p>
                                            </div>
                                            <span className={"text-[10px] font-black px-2 py-1 rounded text-white flex-shrink-0 " + (r.status === 'Sakit' ? 'bg-blue-500' : r.status === 'Izin' ? 'bg-orange-500' : 'bg-red-500')}>{r.status}</span>
                                        </div>
                                    ))}
                                    {belumTercatat.filter(p => passChurch(p.kelas)).map((p, i) => (
                                        <div key={'bl'+i} className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl">
                                            <div className="min-w-0">
                                                <p className="text-xs font-bold text-slate-700 truncate">{p.nama}</p>
                                                <p className="text-[10px] font-bold text-slate-400">{norm(p.kelas)}</p>
                                            </div>
                                            <span className="text-[10px] font-black px-2 py-1 rounded bg-slate-300 text-slate-600 flex-shrink-0">Belum Absen</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* === LAPORAN PDF GRAFIK === */}
                        <div className="bg-gradient-to-br from-violet-50 to-blue-50 p-4 rounded-2xl border-2 border-violet-100 shadow-sm">
                            <div className="flex items-center gap-2 mb-3">
                                <div className="w-8 h-8 bg-violet-600 text-white rounded-lg flex items-center justify-center"><Ico name="file-text" size={16} /></div>
                                <div>
                                    <h3 className="font-black text-slate-700 text-sm leading-none font-fredoka">Laporan PDF Grafik</h3>
                                    <p className="text-[10px] font-bold text-slate-400 mt-0.5">Rekap profesional siap cetak</p>
                                </div>
                            </div>

                            {/* Pilih periode */}
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Periode Laporan</label>
                            <div className="grid grid-cols-3 gap-2 mt-1.5 mb-3">
                                {[
                                    { key: 'tanggal', label: 'Per Tanggal', icon: 'calendar' },
                                    { key: 'bulan', label: 'Per Bulan', icon: 'calendar-days' },
                                    { key: 'berkala', label: 'Berkala', icon: 'calendar-range' }
                                ].map(opt => (
                                    <button key={opt.key} onClick={() => setReportPeriod(opt.key)} className={"flex flex-col items-center gap-1 py-2.5 rounded-xl text-[10px] font-black border-2 transition active:scale-95 " + (reportPeriod === opt.key ? 'bg-violet-600 text-white border-violet-700 shadow-md shadow-violet-200' : 'bg-white text-slate-500 border-slate-100 hover:bg-slate-50')}>
                                        <Ico name={opt.icon} size={16} />
                                        <span>{opt.label}</span>
                                    </button>
                                ))}
                            </div>

                            {/* Input sesuai periode */}
                            {reportPeriod === 'tanggal' && (
                                <div className="mb-3">
                                    <label className="text-[10px] font-bold text-slate-400 ml-1">Tanggal</label>
                                    <input type="date" value={viewDate} onChange={(e) => setViewDate(e.target.value)} className="w-full mt-1 bg-white border-2 border-slate-100 text-slate-700 text-xs font-bold py-2.5 px-3 rounded-xl focus:outline-none focus:border-violet-400" />
                                </div>
                            )}
                            {reportPeriod === 'bulan' && (
                                <div className="mb-3">
                                    <label className="text-[10px] font-bold text-slate-400 ml-1">Bulan</label>
                                    <input type="month" value={reportMonth} onChange={(e) => setReportMonth(e.target.value)} className="w-full mt-1 bg-white border-2 border-slate-100 text-slate-700 text-xs font-bold py-2.5 px-3 rounded-xl focus:outline-none focus:border-violet-400" />
                                </div>
                            )}
                            {reportPeriod === 'berkala' && (
                                <div className="flex gap-2 mb-3">
                                    <div className="flex-1">
                                        <label className="text-[10px] font-bold text-slate-400 ml-1">Dari</label>
                                        <input type="date" value={reportStart} onChange={(e) => setReportStart(e.target.value)} className="w-full mt-1 bg-white border-2 border-slate-100 text-slate-700 text-xs font-bold py-2.5 px-2 rounded-xl focus:outline-none focus:border-violet-400" />
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-[10px] font-bold text-slate-400 ml-1">Sampai</label>
                                        <input type="date" value={reportEnd} onChange={(e) => setReportEnd(e.target.value)} className="w-full mt-1 bg-white border-2 border-slate-100 text-slate-700 text-xs font-bold py-2.5 px-2 rounded-xl focus:outline-none focus:border-violet-400" />
                                    </div>
                                </div>
                            )}

                            <button onClick={handleExportPDF} disabled={pdfBuilding} className={"w-full text-white font-black py-3.5 rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-sm " + (pdfBuilding ? 'bg-slate-400 cursor-wait' : 'bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-700 hover:to-blue-700 shadow-violet-200')}>
                                {pdfBuilding ? (<><span className="inline-block animate-spin"><Ico name="loader" size={18} /></span> Menyusun Laporan...</>) : (<><Ico name="file-text" size={18} /> Export Laporan PDF</>)}
                            </button>
                            <p className="text-[10px] text-slate-400 font-bold text-center mt-2">Grafik tren, komposisi status & per kelompok dalam satu PDF</p>
                        </div>

                        <button onClick={handleExportAttendance} className="w-full bg-emerald-500 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-emerald-200 hover:bg-emerald-600 transition active:scale-95 flex items-center justify-center gap-2 text-sm">
                            <Ico name="download" size={18} /> Export Data ke Excel
                        </button>
                    </div>
                </div>
                );
            }

            if (view === 'live_report') {
                let displayData = liveAttendance.filter(item => {
