    <script>
        // === INISIALISASI FIREBASE (versi COMPAT, tanpa import/module) ===
        // PENTING: Versi sebelumnya memakai `import`/`type="module"`. Babel standalone
        // (in-browser) memindai tag <script> dan menabrak statement `import`, melempar
        // "Cannot use import statement outside a module" lalu menghentikan eksekusi
        // SEBELUM React render -> layar putih.
        //
        // Solusi final: pakai Firebase COMPAT yang dimuat sebagai <script src> biasa di
        // <head>. Tidak ada lagi kata `import` di seluruh halaman, sehingga Babel aman.
        // API compat memetakan ke struktur yang sama dengan yang dipakai aplikasi:
        // window.db, window.fs (modular-style wrappers), window.auth, dsb.
        (function () {
            // --- PWA SERVICE WORKER REGISTRATION ---
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js').catch(function (e) { console.log('SW not found, skipping'); });
                });
            }

            var firebaseConfig;
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    firebaseConfig = JSON.parse(__firebase_config);
                } else {
                    firebaseConfig = {
                        apiKey: "AIzaSyDmdLpNJHx6ZnfJyQBZJIw2CuxEjgpDcUY",
                        authDomain: "asggkpstgr.firebaseapp.com",
                        projectId: "asggkpstgr",
                        storageBucket: "asggkpstgr.firebasestorage.app",
                        messagingSenderId: "681951652798",
                        appId: "1:681951652798:web:aa7344c5e2c376f753a7ef",
                        measurementId: "G-5P5JQ7KHLE"
                    };
                }
            } catch (e) { console.error("Firebase config parse error", e); }

            try {
                if (typeof firebase === 'undefined') {
                    throw new Error("Library Firebase gagal dimuat dari CDN (gstatic). Periksa koneksi internet.");
                }
                var app = firebase.initializeApp(firebaseConfig);
                var auth = firebase.auth();
                var db = firebase.firestore();

                window.db = db;
                window.auth = auth;

                // --- Adapter: bungkus API compat agar dipanggil dengan gaya modular ---
                // Aplikasi memakai bentuk fungsi modular seperti collection(db, 'x'),
                // doc(db, 'x', 'y'), getDocs(q), dst. Wrapper di bawah menerjemahkannya
                // ke API compat (db.collection(...).doc(...)) tanpa mengubah kode aplikasi.

                window.signInAnonymously = function (a) { return (a || auth).signInAnonymously(); };
                window.signInWithCustomToken = function (a, t) { return (a || auth).signInWithCustomToken(t); };
                window.onAuthStateChanged = function (a, cb) { return (a || auth).onAuthStateChanged(cb); };

                // Bangun referensi dari argumen bergaya modular, mendukung path yang
                // mengandung "/" di dalam satu argumen (mis. doc(db, "a/b/c/d")).
                // wantDoc=true -> hasil akhir harus DocumentReference; false -> CollectionReference.
                function buildRef(args, wantDoc) {
                    var root = args[0];
                    // Gabungkan semua segmen path menjadi satu array, pisah oleh "/"
                    var segs = [];
                    for (var i = 1; i < args.length; i++) {
                        String(args[i]).split('/').forEach(function (s) {
                            if (s !== '') segs.push(s);
                        });
                    }
                    var ref = root;
                    var idx = 0;
                    // root adalah instance firestore: mulai dengan collection
                    // Bergantian collection/doc sesuai posisi segmen.
                    while (idx < segs.length) {
                        if (ref.collection) {
                            ref = ref.collection(segs[idx]); idx++;
                        } else if (ref.doc) {
                            ref = ref.doc(segs[idx]); idx++;
                        }
                    }
                    return ref;
                }

                window.fs_buildRef = buildRef;

                window.fs = {
                    collection: function () { return buildRef(arguments, false); },
                    doc: function () { return buildRef(arguments, true); },
                    setDoc: function (ref, data, opts) { return ref.set(data, opts || {}); },
                    getDoc: function (ref) {
                        return ref.get().then(function (snap) {
                            // Samakan API dengan modular: snap.exists() & snap.data()
                            return {
                                exists: function () { return snap.exists; },
                                data: function () { return snap.data(); },
                                id: snap.id,
                                _snap: snap
                            };
                        });
                    },
                    getDocs: function (q) {
                        return q.get().then(function (qs) {
                            return {
                                forEach: function (fn) { qs.forEach(fn); },
                                docs: qs.docs,
                                size: qs.size,
                                empty: qs.empty
                            };
                        });
                    },
                    onSnapshot: function (ref, cb, errCb) {
                        // Bungkus snapshot agar kompatibel dengan pemakaian modular di app:
                        // - DocumentSnapshot: app memanggil snap.exists() (fungsi) & snap.data()
                        //   tapi compat menyediakan .exists (properti). Kita bungkus.
                        // - QuerySnapshot: app memakai snap.docs.map(d => d.data()) -> sudah cocok
                        //   native di compat, teruskan apa adanya.
                        return ref.onSnapshot(function (snap) {
                            if (snap && typeof snap.exists === 'boolean') {
                                // DocumentSnapshot (compat punya .exists sbg boolean)
                                cb({
                                    exists: function () { return snap.exists; },
                                    data: function () { return snap.data(); },
                                    id: snap.id,
                                    ref: snap.ref,
                                    _snap: snap
                                });
                            } else {
                                // QuerySnapshot — teruskan langsung (punya .docs, .forEach, dll)
                                cb(snap);
                            }
                        }, errCb);
                    },
                    deleteDoc: function (ref) { return ref.delete(); },
                    query: function (ref) {
                        // query(ref, orderBy(...), ...) -> terapkan constraint berurutan
                        var q = ref;
                        for (var i = 1; i < arguments.length; i++) {
                            var c = arguments[i];
                            if (typeof c === 'function') q = c(q);
                        }
                        return q;
                    },
                    orderBy: function (field, dir) {
                        // Kembalikan fungsi constraint untuk dipakai window.fs.query
                        return function (q) { return q.orderBy(field, dir || 'asc'); };
                    },
                    writeBatch: function (d) { return (d || db).batch(); },
                };

                window.isFirebaseInitialized = true;
            } catch (e) {
                console.error("Firebase init error", e);
                window.firebaseInitError = (e && e.message) ? e.message : "Gagal menginisialisasi Firebase";
            }
        })();
    </script>
    <script>
        // === DIAGNOSTIK: tampilkan error fatal ke layar, bukan halaman kosong ===
        // Banyak kegagalan (CDN gagal load, script error, dsb) hanya muncul di console
        // sehingga pengguna hanya melihat layar putih. Handler ini menampilkannya di layar.
        (function () {
            function showFatal(title, detail) {
                var box = document.getElementById('fatal-error-box');
                if (!box) {
                    box = document.createElement('div');
                    box.id = 'fatal-error-box';
                    box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;color:#0f172a;padding:24px;font-family:system-ui,sans-serif;overflow:auto;';
                    document.body && document.body.appendChild(box);
                }
                box.innerHTML =
                    '<div style="max-width:640px;margin:40px auto;border:2px solid #fecaca;border-radius:16px;padding:24px;background:#fff5f5;">' +
                    '<h2 style="margin:0 0 8px;font-size:20px;font-weight:800;color:#be123c;">⚠️ ' + title + '</h2>' +
                    '<p style="font-size:13px;color:#475569;margin:0 0 12px;">Salin pesan di bawah ini dan kirim untuk diagnosa:</p>' +
                    '<pre style="white-space:pre-wrap;word-break:break-word;background:#1e293b;color:#f1f5f9;padding:12px;border-radius:8px;font-size:12px;margin:0;">' +
                    (detail || '').toString().replace(/</g,'&lt;') + '</pre>' +
                    '<button onclick="location.reload()" style="margin-top:16px;background:#0ea5e9;color:#fff;border:0;padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;">Muat Ulang</button>' +
                    '</div>';
            }
            window.__showFatal = showFatal;

            // Tangkap error pemuatan resource (script/style/img CDN gagal)
            window.addEventListener('error', function (ev) {
                if (ev && ev.target && (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK')) {
                    var src = ev.target.src || ev.target.href || '(tidak diketahui)';
                    window.firebaseModuleLoadFailed = true;
                    window.__resourceError = src;
                    if (/react|babel|tailwind|unpkg|gstatic/.test(src)) {
                        showFatal('Gagal memuat komponen penting', 'Resource gagal dimuat:\n' + src + '\n\nKemungkinan: koneksi internet bermasalah atau CDN diblokir jaringan.');
                    }
                }
            }, true);

            // Tangkap error JavaScript runtime
            window.addEventListener('error', function (ev) {
                if (ev && ev.message && !(ev.target && ev.target.tagName)) {
                    showFatal('Terjadi kesalahan skrip', ev.message + '\n\n' + (ev.filename || '') + ':' + (ev.lineno || '') + '\n\n' + ((ev.error && ev.error.stack) || ''));
                }
            });

            // Tangkap promise rejection
            window.addEventListener('unhandledrejection', function (ev) {
                var r = ev && ev.reason;
                var msg = (r && (r.message || r.toString())) || 'Unhandled promise rejection';
                window.__lastRejection = msg;
            });
        })();
    </script>

    <script type="text/jsx-classic" id="app-jsx">
        const { useState, useEffect, useLayoutEffect, useRef } = React;

        // Helper global: render ikon lucide TANPA mengganti node <i> (non-destruktif).
        // window.lucide.createIcons() bawaan mengganti <i> dengan <svg>, menghapus node
        // yang dikelola React -> memicu "removeChild ... not a child of this node".
        // Fungsi ini hanya MENGISI innerHTML tiap <i data-lucide> dengan SVG, sehingga
        // node <i> tetap milik React dan struktur pohon DOM tidak berubah.
        window.__safeLucideIcons = function () {
            try {
                const lucide = window.lucide;
                if (!lucide) return;
                const toKebab = (s) => s
                    .replace(/([a-z])([A-Z])/g, '$1-$2')
                    .replace(/([A-Za-z])([0-9])/g, '$1-$2')
                    .replace(/[\s_]+/g, '-')
                    .toLowerCase();
                if (!window.__lucideIconMap && lucide.icons) {
                    const m = {};
                    for (const key in lucide.icons) m[toKebab(key)] = lucide.icons[key];
                    window.__lucideIconMap = m;
                }
                const iconMap = window.__lucideIconMap || {};
                const nodes = document.querySelectorAll('i[data-lucide]');
                nodes.forEach((el) => {
                    if (el.querySelector('svg')) return; // sudah terisi
                    const name = el.getAttribute('data-lucide');
                    const data = iconMap[name] || (lucide.icons && lucide.icons[name]);
                    if (!data || !Array.isArray(data)) return;
                    let svg = '';
                    try {
                        const node = lucide.createElement(data);
                        svg = node && node.outerHTML ? node.outerHTML : '';
                    } catch (e2) {}
                    if (svg) {
                        const w = el.getAttribute('width');
                        if (w) svg = svg.replace('<svg ', `<svg width="${w}" height="${w}" `);
                        el.innerHTML = svg;
                    }
                });
            } catch (e) {}
        };

            const [isInstallModalOpen, setIsInstallModalOpen] = useState(false);
            const [deleteConfig, setDeleteConfig] = useState({ show: false, path: null });
            const [adminResetConfig, setAdminResetConfig] = useState({ show: false, user: null, newPass: '' });
            const [notification, setNotification] = useState(null);
            // Broadcast State Modified
            const [activeBroadcast, setActiveBroadcast] = useState(null);
            const [showBroadcastModal, setShowBroadcastModal] = useState(false);
            const [hasUnreadBroadcast, setHasUnreadBroadcast] = useState(false);

            const [broadcastForm, setBroadcastForm] = useState({ title: '', message: '', type: 'info', schedule: '' });
            const [broadcastHistory, setBroadcastHistory] = useState([]);
            const [editingId, setEditingId] = useState(null);
            const [newUser, setNewUser] = useState({ username: '', password: '', role: 'petugas', nama: '' });
            const [selfPassword, setSelfPassword] = useState('');
            const [resetForm, setResetForm] = useState({ username: '', newPassword: '', token: '' });
            const [connectionError, setConnectionError] = useState(null);
            const [liveAttendance, setLiveAttendance] = useState([]);
            const [attendanceMode, setAttendanceMode] = useState(false);
            const [sessionConfig, setSessionConfig] = useState({ isOpen: true, autoMode: false, openTime: '07:00', closeTime: '12:00' });
            const [filterManual, setFilterManual] = useState("");
            const [filterUser, setFilterUser] = useState("");
            
            const [liveSearch, setLiveSearch] = useState("");
            const [liveClassFilter, setLiveClassFilter] = useState("Semua");
            const [statGroupBy, setStatGroupBy] = useState("status"); // status | gereja | jam
            const [statSort, setStatSort] = useState("desc"); // desc | asc
            const [statChurchFilter, setStatChurchFilter] = useState("Semua");
            // --- Laporan PDF: periode & data rentang ---
            // Catatan: hitung tanggal awal secara inline (lazy initializer) karena
            // getSafeDateId() didefinisikan di bawah; memanggilnya di sini akan memicu
            // "Cannot access 'getSafeDateId' before initialization".
            const __todayId = () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            };
            const [reportPeriod, setReportPeriod] = useState("bulan"); // tanggal | bulan | berkala
            const [reportMonth, setReportMonth] = useState(() => __todayId().slice(0, 7)); // YYYY-MM
            const [reportStart, setReportStart] = useState(() => __todayId());
            const [reportEnd, setReportEnd] = useState(() => __todayId());
            const [rangeData, setRangeData] = useState(null); // {byDate:{date:[records]}, all:[records]}
            const [rangeLoading, setRangeLoading] = useState(false);
            const [pdfBuilding, setPdfBuilding] = useState(false);
            const [isThinking, setIsThinking] = useState(false);
            const [aiResponse, setAiResponse] = useState(null);

            // --- Refs & Helpers ---
            const attendanceModeRef = useRef(attendanceMode);
            const liveAttendanceRef = useRef(liveAttendance);
            const sessionConfigRef = useRef(sessionConfig);
            
            const getSafeDateId = () => {
                const d = new Date();
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            // Deteksi jenis kelamin dari awalan nama GSM:
            //  - "B" / "Bang" -> Laki-laki (L)   contoh: "B Robert", "Bang Robert", "B. Robert"
            //  - "K" / "Kak"  -> Perempuan (P)   contoh: "K Sunny", "Kak Sunny", "K. Sunny"
            // Dipakai sebagai fallback saat field gender peserta belum diisi.
            const genderFromName = (nama) => {
                if (!nama) return '?';
                const s = String(nama).trim().toLowerCase();
                if (/^bang\b/.test(s) || /^b[\s.\-]/.test(s) || s === 'b') return 'L';
                if (/^kak\b/.test(s) || /^k[\s.\-]/.test(s) || s === 'k') return 'P';
                return '?';
            };
            // Penentu gender final: utamakan field gender; jika kosong, pakai awalan nama.
            const resolveGender = (obj, fallbackName) => {
                if (obj && (obj.gender === 'L' || obj.gender === 'P')) return obj.gender;
                return genderFromName((obj && obj.nama) || fallbackName);
            };

            const [viewDate, setViewDate] = useState(getSafeDateId());
            const [refreshKey, setRefreshKey] = useState(0);
            const classList = ["Daud", "Daniel", "Paulus", "Ester", "Pos PI Timotius", "Pos PI Abaraham", "GKPS-PersBSD", "PAGI", "UMUM", "Pendeta", "Pembimbing", "Pengurus", "PMJ"];
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-gkps-app';
            const defaultTheme = { title: "", weeks: [] };
            // --- Effects for Refs ---
            useEffect(() => { attendanceModeRef.current = attendanceMode; }, [attendanceMode]);
            useEffect(() => { liveAttendanceRef.current = liveAttendance; }, [liveAttendance]);
            useEffect(() => { sessionConfigRef.current = sessionConfig; }, [sessionConfig]);
            useLayoutEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); }, [view]);
            useEffect(() => {
                // Render ikon lucide secara non-destruktif (lihat window.__safeLucideIcons).
                let raf = requestAnimationFrame(() => { if (window.__safeLucideIcons) window.__safeLucideIcons(); });
                return () => cancelAnimationFrame(raf);
            });

            // Komponen ikon inline-SVG khusus untuk view 'statistik'.
            // Lucide menukar <i data-lucide> menjadi <svg> langsung di DOM (di luar React),
            // sehingga pada list dinamis bisa memicu error "removeChild ... not a child of this node".
            // Dengan inline SVG, React mengelola node-nya sendiri dan konflik hilang.
            const Ico = ({ name, size = 18, className = "" }) => {
                const s = { width: size, height: size };
                const common = { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style: s, className: className };
                const paths = {
                    'arrow-left': <><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></>,
                    'calendar': <><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></>,
                    'chevron-down': <path d="m6 9 6 6 6-6"/>,
                    'users': <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></>,
                    'user-check': <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></>,
                    'user-x': <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5M22 8l-5 5"/></>,
                    'help-circle': <><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>,
                    'list-checks': <><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></>,
                    'church': <><path d="m18 7 4 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9l4-2"/><path d="M14 22v-4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v4"/><path d="M18 22V5l-6-3-6 3v17"/><path d="M12 7v5M10 9h4"/></>,
                    'clock': <><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></>,
                    'bar-chart-3': <><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></>,
                    'bar-chart-2': <><path d="M18 20V10M12 20V4M6 20v-6"/></>,
                    'download': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></>,
                    'pie-chart': <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>,
                    'chevron-right': <path d="m9 18 6-6-6-6"/>,
                    'file-text': <><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M16 13H8M16 17H8M10 9H8"/></>,
                    'calendar-days': <><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></>,
                    'calendar-range': <><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M17 14h-6M9 18h6M7 14h.01M7 18h.01"/></>,
                    'loader': <><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></>,
                    'user': <><circle cx="12" cy="8" r="5"/><path d="M3 21v-1a7 7 0 0 1 14 0v1"/></>,
                    'venus-mars': <><circle cx="12" cy="9" r="4"/><path d="M12 13v8M9 18h6"/></>,
                    'gift': <><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></>,
                    'trophy': <><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>,
                    'sparkles': <><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/><path d="M5 3v4M19 17v4M3 5h4M17 19h4"/></>,
                    'rotate-cw': <><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>,
                    'sunrise': <><path d="M12 2v8M4.93 10.93l1.41 1.41M2 18h2M20 18h2M17.66 12.34l1.41-1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/></>,
                    'moon': <><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></>,
                    'ferris-wheel': <><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M22 12h-4M6 12H2M19.07 4.93l-2.83 2.83M7.76 16.24l-2.83 2.83M19.07 19.07l-2.83-2.83M7.76 7.76 4.93 4.93"/></>,
                };
                return <svg {...common}>{paths[name] || null}</svg>;
            };

            // ============================================================
            // FITUR BARU: SPIN WHEEL DOORPRIZE
            // Komponen mandiri; hooks-nya terisolasi di sini sehingga TIDAK
            // mengganggu urutan hooks komponen utama. Menerima data absensi
            // (records) via props, memfilter berdasarkan jam check-in.
            // ============================================================
            const SpinWheelView = ({ records, viewDate, onBack }) => {
                const { useState: uState, useMemo: uMemo, useRef: uRef } = React;
                // Kategori: 'early' = check-in < 19:00, 'mid' = 19:00 s/d 20:00
                const [category, setCategory] = uState('early');
                const [rotation, setRotation] = uState(0);
                const [spinning, setSpinning] = uState(false);
                const [winner, setWinner] = uState(null);
                // Pemenang yang sudah keluar (agar bisa dikecualikan bila diinginkan)
                const [pastWinners, setPastWinners] = uState([]); // {id, nama, category}
                const [excludeWinners, setExcludeWinners] = uState(true);
                const wheelRef = uRef(null);

                // Ambil jam (0-23) & menit dari sebuah record kehadiran.
                const getHourMinute = (r) => {
                    // Prioritas: timestamp (epoch ms) -> paling akurat.
                    if (r && typeof r.timestamp === 'number' && r.timestamp > 0) {
                        const d = new Date(r.timestamp);
                        return d.getHours() * 60 + d.getMinutes();
                    }
                    // Fallback: field 'jam' berformat "HH:MM".
                    if (r && r.jam && typeof r.jam === 'string') {
                        const parts = r.jam.split(':');
                        const h = parseInt(parts[0], 10);
                        const m = parseInt(parts[1], 10) || 0;
                        if (!isNaN(h)) return h * 60 + m;
                    }
                    return null;
                };

                const EARLY_CUTOFF = 19 * 60;   // 19:00
                const MID_CUTOFF = 20 * 60;      // 20:00

                // Hanya peserta berstatus Hadir yang ikut undian.
                const eligibleAll = uMemo(() => {
                    return (records || []).filter(r => r && r.status === 'Hadir' && getHourMinute(r) !== null);
                }, [records]);

                const pool = uMemo(() => {
                    let list = eligibleAll.filter(r => {
                        const t = getHourMinute(r);
                        if (category === 'early') return t < EARLY_CUTOFF;
                        return t >= EARLY_CUTOFF && t < MID_CUTOFF; // 19:00 - 19:59:59
                    });
                    if (excludeWinners) {
                        const wonIds = new Set(pastWinners.map(w => w.id));
                        list = list.filter(r => !wonIds.has(r.id));
                    }
                    // Urutkan agar warna segmen stabil.
                    return list.slice().sort((a, b) => String(a.nama).localeCompare(String(b.nama)));
                }, [eligibleAll, category, excludeWinners, pastWinners]);

                const segColors = ['#f97316','#3b82f6','#10b981','#ef4444','#8b5cf6','#ec4899','#eab308','#14b8a6','#6366f1','#f43f5e'];
                const n = pool.length;
                const size = 300;
                const cx = size / 2, cy = size / 2, radius = size / 2 - 4;

                const polar = (angleDeg, r) => {
                    const a = (angleDeg - 90) * Math.PI / 180;
                    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
                };

                const buildSegments = () => {
                    if (n === 0) return null;
                    if (n === 1) {
                        // Satu peserta -> lingkaran penuh.
                        return (
                            <g>
                                <circle cx={cx} cy={cy} r={radius} fill={segColors[0]} stroke="#fff" strokeWidth="2" />
                                <text x={cx} y={cy} textAnchor="middle" dominantBaseline="middle" fill="#fff" fontSize="13" fontWeight="800" transform={`rotate(0 ${cx} ${cy})`}>
                                    {String(pool[0].nama).slice(0, 16)}
                                </text>
                            </g>
                        );
                    }
                    const seg = 360 / n;
                    return pool.map((p, i) => {
                        const start = i * seg;
                        const end = (i + 1) * seg;
                        const p1 = polar(start, radius);
                        const p2 = polar(end, radius);
                        const largeArc = seg > 180 ? 1 : 0;
                        const d = `M ${cx} ${cy} L ${p1.x} ${p1.y} A ${radius} ${radius} 0 ${largeArc} 1 ${p2.x} ${p2.y} Z`;
                        const mid = start + seg / 2;
                        const labelPos = polar(mid, radius * 0.62);
                        const short = String(p.nama).length > 14 ? String(p.nama).slice(0, 13) + '…' : String(p.nama);
                        return (
                            <g key={p.id || i}>
                                <path d={d} fill={segColors[i % segColors.length]} stroke="#ffffff" strokeWidth="1.5" />
                                <text
                                    x={labelPos.x} y={labelPos.y}
                                    textAnchor="middle" dominantBaseline="middle"
                                    fill="#ffffff" fontSize={n > 16 ? 8 : n > 10 ? 9 : 11} fontWeight="700"
                                    transform={`rotate(${mid} ${labelPos.x} ${labelPos.y})`}
                                >
                                    {short}
                                </text>
                            </g>
                        );
                    });
                };

                const doSpin = () => {
                    if (spinning || n === 0) return;
                    setWinner(null);
                    const seg = 360 / n;
                    const winnerIndex = Math.floor(Math.random() * n);
                    // Sudut tengah segmen pemenang.
                    const segMid = winnerIndex * seg + seg / 2;
                    // Pointer berada di atas (0°/12 o'clock). Kita ingin segMid berhenti di atas.
                    const spins = 6 + Math.floor(Math.random() * 3); // 6-8 putaran penuh
                    const baseTarget = spins * 360 + (360 - segMid);
                    // Tambah dari rotasi terkini agar arah selalu maju.
                    const current = rotation % 360;
                    const target = rotation - current + baseTarget;
                    setSpinning(true);
                    setRotation(target);
                    window.setTimeout(() => {
                        setSpinning(false);
                        const w = pool[winnerIndex];
                        setWinner(w);
                        setPastWinners(prev => [{ id: w.id, nama: w.nama, category, at: Date.now() }, ...prev]);
                    }, 5200);
                };

                const catMeta = {
                    early: { label: 'Early Birds', sub: 'Check-in sebelum 19:00', icon: 'sunrise', color: 'from-amber-400 to-orange-500' },
                    mid:   { label: 'Jam 19:00 – 20:00', sub: 'Check-in antara 19:00–20:00', icon: 'moon', color: 'from-indigo-500 to-violet-600' },
                };

                return (
                    <div className="min-h-screen bg-slate-50 p-4 pb-20 animate-bounce-in">
                        <div className="flex items-center justify-between mb-4 sticky top-0 bg-slate-50/90 backdrop-blur-md py-2 z-20">
                            <button onClick={onBack} className="bg-white border border-slate-200 text-slate-600 p-3 rounded-xl hover:bg-slate-100 transition shadow-sm active:scale-95"><Ico name="arrow-left" size={20} /></button>
                            <div className="text-right">
                                <h2 className="font-black text-2xl text-slate-800 font-fredoka flex items-center gap-2 justify-end"><Ico name="gift" size={22} className="text-orange-500" /> Spin Wheel</h2>
                                <p className="text-xs font-bold text-slate-400">Undian Doorprize · {viewDate}</p>
                            </div>
                        </div>

                        {/* Pilih kategori */}
                        <div className="grid grid-cols-2 gap-3 mb-5">
                            {['early','mid'].map(key => {
                                const m = catMeta[key];
                                const active = category === key;
                                const count = eligibleAll.filter(r => {
                                    const t = getHourMinute(r);
                                    if (key === 'early') return t < EARLY_CUTOFF;
                                    return t >= EARLY_CUTOFF && t < MID_CUTOFF;
                                }).length;
                                return (
                                    <button key={key} onClick={() => { if (!spinning) { setCategory(key); setWinner(null); } }}
                                        className={`p-4 rounded-2xl border-2 text-left transition active:scale-95 relative overflow-hidden ${active ? `bg-gradient-to-br ${m.color} border-transparent text-white shadow-lg` : 'bg-white border-slate-200 text-slate-600'}`}>
                                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center mb-2 ${active ? 'bg-white/25 text-white' : 'bg-slate-100 text-slate-500'}`}><Ico name={m.icon} size={18} /></div>
                                        <h4 className={`font-black text-sm ${active ? 'text-white' : 'text-slate-700'}`}>{m.label}</h4>
                                        <p className={`text-[10px] font-bold ${active ? 'text-white/80' : 'text-slate-400'}`}>{m.sub}</p>
                                        <span className={`inline-block mt-1 text-[10px] font-black px-2 py-0.5 rounded-full ${active ? 'bg-white/25 text-white' : 'bg-slate-100 text-slate-500'}`}>{count} peserta</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Roda */}
                        <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 flex flex-col items-center mb-5">
                            {n === 0 ? (
                                <div className="py-16 text-center">
                                    <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-300"><Ico name="ferris-wheel" size={32} /></div>
                                    <p className="font-black text-slate-500 text-sm">Belum ada peserta memenuhi syarat</p>
                                    <p className="text-[11px] text-slate-400 font-bold mt-1">
                                        {category === 'early' ? 'Belum ada yang check-in sebelum jam 19:00.' : 'Belum ada yang check-in antara jam 19:00–20:00.'}
                                    </p>
                                    {excludeWinners && pastWinners.some(w => w.category === category) && (
                                        <p className="text-[11px] text-amber-500 font-bold mt-2">Semua kandidat mungkin sudah pernah menang. Matikan "kecualikan pemenang" untuk mengundi ulang.</p>
                                    )}
                                </div>
                            ) : (
                                <div className="relative" style={{ width: size, maxWidth: '100%' }}>
                                    {/* Pointer */}
                                    <div className="absolute left-1/2 -translate-x-1/2 -top-1 z-10" style={{ filter: 'drop-shadow(0 2px 3px rgba(0,0,0,0.25))' }}>
                                        <svg width="34" height="34" viewBox="0 0 34 34"><path d="M17 32 L4 6 Q17 14 30 6 Z" fill="#ef4444" stroke="#fff" strokeWidth="2"/></svg>
                                    </div>
                                    <svg
                                        ref={wheelRef}
                                        viewBox={`0 0 ${size} ${size}`}
                                        width={size} height={size}
                                        style={{
                                            width: '100%', height: 'auto',
                                            transform: `rotate(${rotation}deg)`,
                                            transition: spinning ? 'transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99)' : 'none',
                                        }}
                                    >
                                        <circle cx={cx} cy={cy} r={radius + 3} fill="#1e293b" />
                                        {buildSegments()}
                                        <circle cx={cx} cy={cy} r="22" fill="#1e293b" stroke="#fff" strokeWidth="3" />
                                        <circle cx={cx} cy={cy} r="8" fill="#f97316" />
                                    </svg>
                                </div>
                            )}

                            <button
                                onClick={doSpin}
                                disabled={spinning || n === 0}
                                className={`mt-5 w-full py-4 rounded-2xl font-black text-lg text-white flex items-center justify-center gap-2 transition active:scale-95 ${spinning || n === 0 ? 'bg-slate-300 cursor-not-allowed' : 'bg-gradient-to-r from-orange-500 to-pink-500 shadow-lg hover:shadow-xl'}`}
                            >
                                <Ico name={spinning ? 'loader' : 'rotate-cw'} size={20} className={spinning ? 'animate-spin' : ''} />
                                {spinning ? 'Memutar...' : `PUTAR (${n} peserta)`}
                            </button>

                            <label className="flex items-center gap-2 mt-3 cursor-pointer select-none">
                                <input type="checkbox" checked={excludeWinners} disabled={spinning} onChange={e => setExcludeWinners(e.target.checked)} className="w-4 h-4 accent-orange-500" />
                                <span className="text-[11px] font-bold text-slate-500">Kecualikan yang sudah pernah menang</span>
                            </label>
                        </div>

                        {/* Pemenang */}
                        {winner && !spinning && (
                            <div className="bg-gradient-to-br from-amber-400 via-orange-500 to-pink-500 rounded-3xl p-6 text-center shadow-xl mb-5 animate-bounce-in relative overflow-hidden">
                                <div className="absolute inset-0 opacity-20" style={{ background: 'radial-gradient(circle at 30% 20%, #fff 0%, transparent 40%)' }}></div>

                    let guard = 0;
                    while (s <= e && guard < 366) {
                        const y = s.getFullYear();
                        const m = String(s.getMonth() + 1).padStart(2, '0');
                        const d = String(s.getDate()).padStart(2, '0');
                        out.push(`${y}-${m}-${d}`);
                        s.setDate(s.getDate() + 1);
                        guard++;
                    }
                };
                if (reportPeriod === 'tanggal') {
                    out.push(viewDate);
                } else if (reportPeriod === 'bulan') {
                    const [y, m] = reportMonth.split('-').map(Number);
                    const last = new Date(y, m, 0).getDate();
                    pushRange(`${reportMonth}-01`, `${reportMonth}-${String(last).padStart(2, '0')}`);
                } else {
                    pushRange(reportStart, reportEnd);
                }
                return out;
            };
            const fetchRangeAttendance = async () => {
                const db = window.db; const { collection, getDocs } = window.fs;
                const basePath = `artifacts/${appId}/public/data`;
                const dates = buildDateList();
                if (dates.length === 0) { alert("Rentang tanggal tidak valid."); return null; }
                setRangeLoading(true);
                const byDate = {}; const all = [];
                try {
                    // ambil paralel namun dibatasi per-batch agar stabil
                    const batchSize = 8;
                    for (let i = 0; i < dates.length; i += batchSize) {
                        const slice = dates.slice(i, i + batchSize);
                        const results = await Promise.all(slice.map(async (dt) => {
                            try {
                                const snap = await getDocs(collection(db, `${basePath}/attendance/${dt}/records`));
                                const recs = snap.docs.map(d => ({ ...d.data(), _date: dt }));
                                return { dt, recs };
                            } catch (e) { return { dt, recs: [] }; }
                        }));
                        results.forEach(({ dt, recs }) => { byDate[dt] = recs; recs.forEach(r => all.push(r)); });
                    }
                    const data = { byDate, all, dates };
                    setRangeData(data);
                    setRangeLoading(false);
                    return data;
                } catch (e) {
                    setRangeLoading(false);
                    alert("Gagal mengambil data: " + (e.message || e));
                    return null;
                }
            };

            // Bangun blok-blok ringkasan dari sekumpulan record absensi
            const computeReport = (records) => {
                const norm = (v) => (v && String(v).trim() && v !== '-') ? String(v).trim() : 'Tanpa Kelompok';
                const genderOf = (r) => {
                    if (r.gender === 'L' || r.gender === 'P') return r.gender;
                    const p = participants.find(pp => pp.id === r.id);
                    if (p && (p.gender === 'L' || p.gender === 'P')) return p.gender;
                    return genderFromName(r.nama || (p && p.nama));
                };
                const hadir = records.filter(r => r.status === 'Hadir').length;
                const izin = records.filter(r => r.status === 'Izin').length;
                const sakit = records.filter(r => r.status === 'Sakit').length;
                const alpha = records.filter(r => r.status === 'Alpha').length;
                const hadirRecs = records.filter(r => r.status === 'Hadir');
                const genderL = hadirRecs.filter(r => genderOf(r) === 'L').length;
                const genderP = hadirRecs.filter(r => genderOf(r) === 'P').length;
                const byChurch = {};
                hadirRecs.forEach(r => { const k = norm(r.kelas); byChurch[k] = (byChurch[k] || 0) + 1; });
                const byHour = {};
                hadirRecs.forEach(r => { if (r.jam) { const h = String(r.jam).split(':')[0].padStart(2, '0') + ':00'; byHour[h] = (byHour[h] || 0) + 1; } });
                return { total: records.length, hadir, izin, sakit, alpha, genderL, genderP, byChurch, byHour };
            };

            // Helper: gambar bar-chart sederhana ke canvas (untuk PDF, tema ungu/biru)
            const drawBarChartCanvas = (title, entries, color, width = 1200, height = 460) => {
                const c = document.createElement('canvas');
                c.width = width; c.height = height;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#1e293b'; ctx.font = 'bold 30px Arial';
                ctx.fillText(title, 30, 46);

                // Lebar label kiri dihitung dinamis dari label terpanjang agar tidak terpotong.
                ctx.font = 'bold 22px Arial';
                let maxLabelW = 0;
                entries.forEach(e => { const w = ctx.measureText(String(e.label)).width; if (w > maxLabelW) maxLabelW = w; });
                const padL = Math.min(width * 0.42, Math.max(160, maxLabelW + 40)); // ruang label cukup, tapi tak lebih dari 42% lebar
                const padR = 90;   // ruang untuk angka di ujung bar
                const padT = 80, padB = 30;
                const plotW = width - padL - padR; const plotH = height - padT - padB;
                const max = Math.max(1, ...entries.map(e => e.value));
                const rowH = plotH / Math.max(entries.length, 1);
                const barH = Math.min(48, rowH - 14);

                entries.forEach((e, i) => {
                    const y = padT + i * rowH + (rowH - barH) / 2;
                    // label (rata kanan, mepet ke bar tapi dengan jarak)
                    ctx.fillStyle = '#334155'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'right';
                    ctx.fillText(String(e.label), padL - 14, y + barH / 2 + 8);
                    ctx.textAlign = 'left';
                    // track
                    ctx.fillStyle = '#eef2ff'; ctx.fillRect(padL, y, plotW, barH);
                    // bar
                    const w = Math.max(4, (e.value / max) * plotW);
                    ctx.fillStyle = e.color || color; ctx.fillRect(padL, y, w, barH);
                    // value: taruh di dalam bar (putih) bila ujung dekat tepi, jika tidak di luar bar
                    ctx.font = 'bold 22px Arial';
                    const valStr = String(e.value);
                    const valW = ctx.measureText(valStr).width;
                    if (padL + w + 12 + valW > width - 8) {
                        ctx.fillStyle = '#ffffff'; ctx.textAlign = 'right';
                        ctx.fillText(valStr, padL + w - 10, y + barH / 2 + 8);
                        ctx.textAlign = 'left';
                    } else {
                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(valStr, padL + w + 12, y + barH / 2 + 8);
                    }
                });
                return c.toDataURL('image/png');
            };
            // Helper: donat komposisi status
            const drawDonutCanvas = (parts, width = 720, height = 460) => {
                const c = document.createElement('canvas'); c.width = width; c.height = height;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#1e293b'; ctx.font = 'bold 30px Arial';
                ctx.fillText('Komposisi Status', 30, 46);
                const cx = 190, cy = 250, rO = 150, rI = 88;
                const total = parts.reduce((s, p) => s + p.value, 0) || 1;
                let ang = -Math.PI / 2;
                parts.forEach(p => {
                    if (p.value <= 0) return;
                    const slice = (p.value / total) * Math.PI * 2;
                    ctx.beginPath(); ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, rO, ang, ang + slice); ctx.closePath();
                    ctx.fillStyle = p.color; ctx.fill();
                    ang += slice;
                });
                // lubang tengah
                ctx.beginPath(); ctx.arc(cx, cy, rI, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center';
                ctx.fillText(String(total), cx, cy + 2); ctx.font = 'bold 18px Arial'; ctx.fillStyle = '#64748b';
                ctx.fillText('Total', cx, cy + 28); ctx.textAlign = 'left';
                // legend (di kanan donat, dengan ruang lega)
                const lx = cx + rO + 40;
                let ly = 130;
                parts.forEach(p => {
                    const pct = Math.round((p.value / total) * 100);
                    ctx.fillStyle = p.color; ctx.fillRect(lx, ly, 28, 28);
                    ctx.fillStyle = '#334155'; ctx.font = 'bold 24px Arial';
                    ctx.fillText(`${p.label}: ${p.value} (${pct}%)`, lx + 40, ly + 23);
                    ly += 52;
                });
                return c.toDataURL('image/png');
            };
            // Helper: tren harian (line) untuk periode bulan/berkala
            const drawTrendCanvas = (series, width = 1040, height = 420) => {
                const c = document.createElement('canvas'); c.width = width; c.height = height;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#1e293b'; ctx.font = 'bold 28px Arial';
                ctx.fillText('Tren Kehadiran Harian', 30, 44);
                const padL = 70, padR = 30, padT = 75, padB = 70;
                const plotW = width - padL - padR, plotH = height - padT - padB;
                const max = Math.max(1, ...series.map(s => s.value));
                // grid & sumbu
                ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
                for (let g = 0; g <= 4; g++) {
                    const y = padT + (plotH / 4) * g;
                    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
                    ctx.fillStyle = '#94a3b8'; ctx.font = '16px Arial'; ctx.textAlign = 'right';
                    ctx.fillText(String(Math.round(max - (max / 4) * g)), padL - 10, y + 5); ctx.textAlign = 'left';
                }
                const n = series.length;
                const stepX = n > 1 ? plotW / (n - 1) : plotW;
                // area + line
                ctx.beginPath();
                series.forEach((s, i) => {
                    const x = padL + stepX * i;
                    const y = padT + plotH - (s.value / max) * plotH;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 3; ctx.stroke();
                // titik & label x (jarang agar tidak penuh)
                const labelEvery = Math.ceil(n / 12);
                series.forEach((s, i) => {
                    const x = padL + stepX * i;
                    const y = padT + plotH - (s.value / max) * plotH;
                    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = '#7c3aed'; ctx.fill();
                    if (i % labelEvery === 0) {
                        ctx.fillStyle = '#64748b'; ctx.font = '15px Arial'; ctx.textAlign = 'center';
                        ctx.fillText(s.label, x, height - padB + 28); ctx.textAlign = 'left';
                    }
                });
                return c.toDataURL('image/png');
            };

            const handleExportPDF = async () => {
                const jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : (window.jsPDF || null);

                    y = 40;

                    const cards = [
                        { l: 'Total Catatan', v: rep.total, c: [241, 245, 249], t: [30, 41, 59] },
                        { l: 'Hadir', v: rep.hadir, c: [209, 250, 229], t: [4, 120, 87] },

                        { l: 'Alpha', v: rep.alpha, c: [254, 226, 226], t: [185, 28, 28] },
                    ];
                    const cw = (pageW - M * 2 - 4 * 4) / 5;
                    cards.forEach((cd, i) => {
                        const x = M + i * (cw + 4);
                        pdf.setFillColor(cd.c[0], cd.c[1], cd.c[2]); pdf.roundedRect(x, y, cw, 20, 2, 2, 'F');
                        pdf.setTextColor(cd.t[0], cd.t[1], cd.t[2]); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15);
                        pdf.text(String(cd.v), x + cw / 2, y + 10, { align: 'center' });
                        pdf.setFontSize(7); pdf.setTextColor(100, 116, 139);
                        pdf.text(cd.l, x + cw / 2, y + 16, { align: 'center' });
                    });
                    y += 26;

                    // Bar tingkat kehadiran
                    pdf.setTextColor(30, 41, 59); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10);
                    pdf.text(`Tingkat Kehadiran: ${hadirPct}%`, M, y);
                    y += 3; pdf.setFillColor(226, 232, 240); pdf.roundedRect(M, y, pageW - M * 2, 5, 2, 2, 'F');
                    pdf.setFillColor(16, 185, 129); pdf.roundedRect(M, y, (pageW - M * 2) * (hadirPct / 100), 5, 2, 2, 'F');
                    y += 12;

                    // Grafik 1: Tren harian (jika bukan per tanggal)
                    if (reportPeriod !== 'tanggal') {
                        const series = data.dates.map(dt => ({
                            label: dt.slice(8) + '/' + dt.slice(5, 7),

                        }));
                        const trendImg = drawTrendCanvas(series);
                        const imgH = (pageW - M * 2) * (420 / 1040);

                        y += imgH + 6;
                    }

                    // Grafik 2 & 3: Donut komposisi + Bar per kelompok berdampingan
                    const donutParts = [
                        { label: 'Hadir', value: rep.hadir, color: '#10b981' },
                        { label: 'Izin', value: rep.izin, color: '#f97316' },
                        { label: 'Sakit', value: rep.sakit, color: '#3b82f6' },
                        { label: 'Alpha', value: rep.alpha, color: '#ef4444' },
                    ].filter(p => p.value > 0);
                    if (donutParts.length > 0) {
                        // Donat komposisi status — full width agar legenda tidak terpotong.
                        const donutImg = drawDonutCanvas(donutParts);
                        const dW = pageW - M * 2; const dH = dW * (460 / 720);

                    {

                            .map(k => ({ label: k, value: rep.byChurch[k], color: '#7c3aed' }))
                            .sort((a, b) => b.value - a.value).slice(0, 10);
                        if (churchEntries.length > 0) {
                            // Tinggi grafik menyesuaikan jumlah kelompok agar tiap baris lega.

                            const barImg = drawBarChartCanvas('Hadir per Kelompok', churchEntries, '#7c3aed', 1200, chH);
                            const bW = pageW - M * 2; const bH = bW * (chH / 1200);

                        const gImg = drawBarChartCanvas('Kehadiran per Jenis Kelamin', genderEntries, '#2563eb', 1200, 280);
                        const gW = pageW - M * 2; const gH = gW * (280 / 1200);
                        if (y + gH > pageH - 16) { pdf.addPage(); y = 18; }
                        pdf.addImage(gImg, 'PNG', M, y, gW, gH);
                        y += gH + 6;

                    // Cek halaman baru untuk tabel rincian harian
                    if (reportPeriod !== 'tanggal') {

                        pdf.text("Rincian Per Tanggal", M, y); y += 6;
                        // header tabel

            // ====== BACKUP & RESTORE ======
            const addBackupLog = (msg) => setBackupLog(prev => [...prev, msg]);

            // Buat daftar tanggal dari backupStartDate sampai hari ini (untuk memindai attendance)
            const buildBackupDateList = () => {
                const out = [];
                let s = new Date(backupStartDate + 'T00:00:00');
                const e = new Date(getSafeDateId() + 'T00:00:00');
                if (isNaN(s)) return out;
                let guard = 0;
                while (s <= e && guard < 1000) {
                    const y = s.getFullYear(), m = String(s.getMonth() + 1).padStart(2, '0'), d = String(s.getDate()).padStart(2, '0');
                    out.push(`${y}-${m}-${d}`);
                    s.setDate(s.getDate() + 1); guard++;
                }
                return out;
            };

            const handleBackup = async () => {
                if (!window.db || !window.fs) { alert("Database belum siap."); return; }
                setBackupBusy(true); setBackupLog([]);
                const db = window.db; const { collection, getDocs, doc, getDoc } = window.fs;
                const basePath = `artifacts/${appId}/public/data`;
                try {
                    const backup = {
                        _meta: {
                            app: "SM GKPS Resort Tangerang",
                            type: "full-backup",
                            version: 1,
                            appId: appId,
                            createdAt: new Date().toISOString(),
                            createdBy: (currentUser && currentUser.nama) || 'admin',
                        },
                        collections: {},
                        docs: {},
                        attendance: {},
                    };

                    // 1) Koleksi sederhana
                    const simpleCols = ['users', 'participants', 'theme_archives', 'broadcast_history'];
                    for (const col of simpleCols) {
                        addBackupLog(`Membaca ${col}...`);
                        try {
                            const snap = await getDocs(collection(db, `${basePath}/${col}`));
                            backup.collections[col] = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
                            addBackupLog(`  ✓ ${col}: ${backup.collections[col].length} dokumen`);
                        } catch (e) { backup.collections[col] = []; addBackupLog(`  ⚠ ${col}: gagal (${e.message})`); }
                    }

                    // 2) Dokumen tunggal
                    const singleDocs = [['config', 'session'], ['config', 'system'], ['theme', 'current'], ['announcements', 'active']];
                    for (const [col, id] of singleDocs) {
                        try {
                            const ds = await getDoc(doc(db, `${basePath}/${col}`, id));
                            if (ds.exists()) { backup.docs[`${col}/${id}`] = ds.data(); addBackupLog(`  ✓ ${col}/${id}`); }
                        } catch (e) { /* abaikan dokumen yang tidak ada */ }
                    }

                    // 3) Attendance per tanggal (pindai rentang)
                    const dates = buildBackupDateList();
                    addBackupLog(`Memindai absensi ${dates.length} hari (sejak ${backupStartDate})...`);
                    let foundDays = 0, totalRecs = 0;
                    const batchSize = 10;
                    for (let i = 0; i < dates.length; i += batchSize) {
                        const slice = dates.slice(i, i + batchSize);
                        const results = await Promise.all(slice.map(async (dt) => {
                            try {
                                const snap = await getDocs(collection(db, `${basePath}/attendance/${dt}/records`));
                                return { dt, recs: snap.docs.map(d => ({ _id: d.id, ...d.data() })) };
                            } catch (e) { return { dt, recs: [] }; }
                        }));
                        results.forEach(({ dt, recs }) => {
                            if (recs.length > 0) { backup.attendance[dt] = recs; foundDays++; totalRecs += recs.length; }
                        });
                        if (i % 50 === 0) addBackupLog(`  ...diproses ${Math.min(i + batchSize, dates.length)}/${dates.length} hari`);
                    }
                    addBackupLog(`  ✓ Absensi: ${foundDays} hari, ${totalRecs} catatan`);

                    backup._meta.summary = {
                        users: (backup.collections.users || []).length,
                        participants: (backup.collections.participants || []).length,
                        attendanceDays: foundDays,
                        attendanceRecords: totalRecs,
                    };

                    // Unduh sebagai file JSON
                    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);

                // Proses sekumpulan baris objek {nama, kategori, kelas, gender}

                        if (!nama) { skipped++; continue; }
                        const kategori = String(r.kategori || 'Umum').trim() || 'Umum';
                        const kelas = String(r.kelas || '-').trim() || '-';
                        const gender = normGender(r.gender);
                        const k = keyOf(nama, kelas);
                        const found = existingMap[k];
                        if (found) {
                            // Perbarui data lama memakai ID yang sudah ada -> tidak menambah duplikat.
                            const merged = { id: found.id, nama, kategori, kelas, gender: gender || found.gender || '' };
                            await saveToCloud(`participants/${found.id}`, merged);
                            existingMap[k] = merged; // cegah dobel dalam file yang sama
                            updated++;

                            const id = `GSM-${Date.now()}-${i}`;
                            const obj = { id, nama, kategori, kelas, gender };

                            added++;
                        }

                };

                        const json = window.XLSX.utils.sheet_to_json(sheet, { defval: '' });
                        const rows = json.map(row => ({
                            nama: row['Nama'] ?? row['nama'] ?? row['NAMA'] ?? '',
                            kategori: row['Kategori'] ?? row['kategori'] ?? row['KATEGORI'] ?? 'Umum',
                            kelas: row['Kelas'] ?? row['kelas'] ?? row['KELAS'] ?? '-',

                            const cols = line.split(',').map(s => (s ?? '').trim());

                        alert("Password Admin berhasil direset paksa & Role diupdate jadi ADMIN.");

                            <div className="relative z-10 flex flex-col h-full overflow-hidden">
                                <div className="pt-6 px-6 shrink-0 text-center">
                                    <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 border-4 bg-white mt-2 ${isUrgent ? 'border-red-100' : 'border-sky-100'}`}>
                                         <div className="bell-ring"><i data-lucide={isUrgent ? "alert-triangle" : "megaphone"} className={`w-10 h-10 ${isUrgent ? 'text-red-500' : 'text-sky-500'}`}></i></div>
                                    </div>
                                    <h3 className={`text-2xl font-black mb-2 font-fredoka leading-tight ${isUrgent ? 'text-red-600' : 'text-sky-600'}`}>{activeBroadcast.title}</h3>
                                </div>

                                <div className="px-6 pb-2 overflow-y-auto modal-scroll flex-1">
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-left">
                                        <p className="text-slate-700 font-medium leading-relaxed whitespace-pre-wrap text-sm">{activeBroadcast.message}</p>
                                        <div className="mt-3 pt-3 border-t border-slate-200 flex justify-between items-center text-xs text-slate-400 font-bold uppercase"><span><i data-lucide="user" width="12" className="inline mr-1"/>{activeBroadcast.sender}</span><span>{activeBroadcast.timestamp.split(' ')[1]}</span></div>
                                    </div>
                                </div>
                                
                                <div className="p-6 pt-4 bg-white shrink-0 border-t border-slate-100">
                                    <button onClick={handleCloseBroadcast} className={`w-full py-3 px-4 rounded-xl font-black text-white transition shadow-lg btn-playful ${isUrgent ? 'bg-red-500 border-red-700 hover:bg-red-600' : 'bg-sky-500 border-sky-700 hover:bg-sky-600'}`}>OKE, SIAP!</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const DeleteConfirmModal = () => (
                <div className="fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4 backdrop-blur-sm animate-bounce-in">

                        <div className="w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="trash-2" className="text-rose-600 w-8 h-8"></i></div>

                        <div className="flex gap-3">
                            <button onClick={() => setDeleteConfig({ show: false, path: null })} className="flex-1 py-3 px-4 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Jangan</button>

                        </div>
                    </div>
                </div>
            );

                        <button onClick={() => setIsInstallModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i data-lucide="x" width="24"></i></button>

                                    <i data-lucide="refresh-cw" width="20"></i> Coba Lagi

                    <div className="min-h-screen flex items-center justify-center bg-school-sunday text-center p-4">
                        <div className="bg-white/80 backdrop-blur-sm p-6 rounded-3xl shadow-xl">
                            <div className="spinner mx-auto mb-4"></div>

                            <div className="w-24 h-24 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-amber-500/50 shadow-[0_0_30px_rgba(245,158,11,0.3)] animate-pulse">

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-2 ml-1">Username</label><input name="username" className="w-full p-4 border-2 border-indigo-100 rounded-2xl bg-white focus:outline-none focus:border-indigo-400 focus:ring-0 transition font-bold text-slate-700 placeholder-Ketik username..." required/></div>

                            <button type="submit" className="w-full btn-playful btn-blue font-black py-4 rounded-2xl text-lg shadow-lg shadow-sky-200 mt-2">MASUK YUK!</button>
                            <button type="button" onClick={() => setView('forgot_password')} className="w-full py-3 mt-4 text-center text-sky-600 font-bold text-xs border-2 border-sky-100 rounded-xl hover:bg-sky-50 transition">Lupa Password / Reset Akun</button>
                        </form>
                        <div className="mt-6 text-center text-xs font-bold bg-white/40 py-2 rounded-xl">
                            {isConnected ? <span className="text-emerald-500 flex items-center justify-center gap-1"><i data-lucide="wifi" width="14"></i> Terhubung ke Cloud</span> : <span className="text-rose-500 animate-pulse">● Menghubungkan...</span>}
                        </div>
                        <div className="mt-8 text-center text-[10px] text-slate-400 font-medium">
                            &copy; {new Date().getFullYear()} Sekolah Minggu GKPS Resort Tangerang
                        </div>
                    </div>
                </div>
            );
            if (view === 'forgot_password') return (
                <div className="min-h-screen bg-school-sunday flex items-center justify-center p-4">

                            <div className="w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-rose-50"><i data-lucide="key-round" className="text-rose-500 w-8 h-8"></i></div>
                            <h1 className="text-2xl font-black text-rose-500 drop-shadow-sm" style={{fontFamily: 'Fredoka, sans-serif'}}>Reset Password</h1>
                            <p className="text-slate-500 font-bold text-xs mt-1">Khusus Akun Admin Utama</p>
                        </div>
                        <div className="space-y-3">
                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Username Admin</label><input className="w-full p-3 border-2 border-indigo-100 rounded-xl bg-white focus:outline-none focus:border-rose-400 focus:ring-0 transition font-bold text-slate-700" placeholder="Username Anda" value={resetForm.username} onChange={e => setResetForm({...resetForm, username: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Password Baru</label><input type="password" className="w-full p-3 border-2 border-indigo-100 rounded-xl bg-white focus:outline-none focus:border-rose-400 focus:ring-0 transition font-bold text-slate-700" placeholder="***" value={resetForm.newPassword} onChange={e => setResetForm({...resetForm, newPassword: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Kode Otorisasi</label><input type="password" className="w-full p-3 border-2 border-indigo-100 rounded-xl bg-white focus:outline-none focus:border-rose-400 focus:ring-0 transition font-bold text-slate-700" placeholder="Kode Master Panitia" value={resetForm.token} onChange={e => setResetForm({...resetForm, token: e.target.value})} /></div>
                            <button onClick={handleResetPassword} className="w-full btn-playful btn-orange py-3 rounded-xl font-black text-lg shadow-lg shadow-orange-100 mt-2">Reset Password</button>
                            <button onClick={() => setView('login')} className="w-full text-slate-400 font-bold text-xs py-2 hover:text-slate-600 transition">Batal, kembali ke Login</button>
                        </div>
                    </div>
                </div>
            );

                const currentTheme = themeData || defaultTheme;
                let displayWeeks = currentTheme.weeks || [];
                if (!Array.isArray(displayWeeks)) displayWeeks = [];
                const gridCols = displayWeeks.length === 1 ? 'grid-cols-1' : 'grid-cols-2';

                return (
                <div key="view-menu" className="min-h-screen bg-school-sunday p-4 pt-8 pb-20 relative">
                      {notification && (
                        <div className="fixed top-6 left-1/2 transform -translate-x-1/2 z-[150] w-full max-w-sm px-4 animate-shake">
                              <div className="bg-yellow-300 border-4 border-yellow-500 text-yellow-900 px-6 py-4 rounded-2xl shadow-xl flex items-center gap-4 animate-bounce-in"><div className="bg-white p-2 rounded-full shadow-sm"><i data-lucide="info" className="text-yellow-600"></i></div><span className="font-bold text-sm leading-tight font-fredoka">{notification}</span></div>
                        </div>
                    )}
                
                    <div className="max-w-md mx-auto glass-panel rounded-[32px] overflow-hidden border-2 border-white/60">
                        <div className="bg-gradient-to-r from-sky-500 to-indigo-600 p-6 text-white relative">
                            <div className="absolute top-0 right-0 p-4 opacity-10 flex items-center gap-4">
                                <img src="logotema.png" className="w-24 h-24 object-contain" alt="Logo GKPS" />
                            </div>
                            
                            {/* Header dengan Tombol Lonceng dan User */}
                            <div className="flex justify-between items-start relative z-10">

                                     <p className="text-white/80 text-xs font-bold mb-1">Shalom,</p>

                                     {/* Tombol Lonceng Notifikasi */}

                                            <span className="absolute top-0 right-0 -mt-1 -mr-1 flex h-4 w-4">

                                            </span>
                                          )}
                                    </button>

                                    <div className="flex gap-2">
                                        <button onClick={handleLogoutClick} className="bg-white/20 hover:bg-white/30 p-3 rounded-2xl text-white transition flex items-center justify-center shadow-inner border border-white/30" title="Keluar"><i data-lucide="log-out" width="20"></i></button>
                                        <button onClick={handleSmoothRefresh} className="bg-emerald-400/20 hover:bg-emerald-400/40 p-3 rounded-2xl text-white transition flex items-center justify-center shadow-inner border border-white/30" title="Refresh Data"><i data-lucide="refresh-cw" width="20"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="p-6 pb-0">
                            {themeData && themeData.title ? (
                                <div className="mb-6 relative z-10">
                                    <div className="flex items-center justify-between mb-4 px-2">
                                        <div>
                                            <div className="flex items-center gap-2 mb-1">
                                                <h2 className="text-xs font-black text-indigo-400 uppercase tracking-widest">Bahan Ajar</h2>
                                                <button onClick={() => setView('theme_archives')} className="text-[10px] bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-2 py-0.5 rounded-full flex items-center gap-1 transition"><i data-lucide="folder-open" width="10"></i> Lihat Arsip</button>
                                            </div>
                                            <h3 className="text-lg font-black text-slate-800 font-fredoka leading-none">"{currentTheme.title}"</h3>
                                        </div>
                                       
                                        {(isAdmin || isPanitia) && (
                                            <button onClick={() => { setEditThemeForm(currentTheme); setView('edit_theme'); }} className="bg-white p-2 rounded-full text-indigo-400 hover:text-indigo-600 shadow-sm border border-indigo-50 transition"><i data-lucide="pencil" width="16"></i></button>
                                        )}
                                    </div>

                                    <div className="flex flex-col gap-3">
                                         {displayWeeks.map((week, idx) => {
                                             const dateObj = week.date ? new Date(week.date) : null;
                                             const dateStr = dateObj ? dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' }) : `Minggu ke-${idx + 1}`;
                                            return (
                                                <button key={idx} onClick={() => setSelectedWeek(week)} className="w-full btn-playful bg-white border-2 border-indigo-500 border-b-4 text-indigo-700 p-4 rounded-2xl flex items-center justify-center shadow-md hover:bg-indigo-50 transition active:scale-95">
                                                     <span className="font-black text-lg font-fredoka text-slate-700">
                                                        <span className="text-red-500">{dateStr}</span>
                                                      </span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : null}
                        </div>

                                 <div className="bg-white/20 p-3 rounded-xl border-2 border-white/30"><i data-lucide="qr-code" width="28" height="28"></i></div>

                            {isPeserta && (
                                <button onClick={() => setView('attendance_manager')} className="w-full btn-playful bg-white border-b-4 border-slate-200 text-slate-700 p-4 rounded-2xl flex items-center gap-4 shadow-lg mt-4">
                                    <div className="bg-indigo-100 text-indigo-600 p-3 rounded-xl"><i data-lucide="clipboard-check" width="24" height="24"></i></div>
                                    <div className="text-left"><h3 className="font-bold text-lg font-fredoka">Input Absen</h3><p className="text-xs text-slate-400 font-bold">Catat Kehadiran Manual</p></div>
                                  </button>
                            )}

                            {(['gsm', 'petugas', 'pembimbing', 'pendeta'].includes(safeUser.role)) && (

                                    <div className="text-left"><h3 className="font-bold text-lg font-fredoka">Data Kehadiran</h3><p className="text-xs text-emerald-100 font-bold opacity-90">Cek List Peserta Hadir</p></div>
                                </button>
                            )}

                            {!isPeserta && (

                                    <div className="bg-white/10 p-2 rounded-full"><i data-lucide="chevron-right" className="text-white relative z-10" width="20"></i></div>

                             <div className="mt-6 border-t border-slate-100 pt-4 text-center">

                            </div>
                        </div>
                    </div>
                    
                    <WeekDetailModal week={selectedWeek} onClose={() => setSelectedWeek(null)} />
                    {isLogoutModalOpen && <LogoutModal />}
                    {isInstallModalOpen && <InstallModal />}
                    {adminResetConfig.show && <AdminResetModal config={adminResetConfig} setConfig={setAdminResetConfig} onConfirm={performAdminReset} />}
                    <BroadcastPopup />
                </div>
            );
            }

            if (view === 'admin_dashboard') {
                const totalUsers = users.length;
                const totalParticipants = participants.length;
                const totalHadirToday = liveAttendance.length;

                return (
                    <div className="min-h-screen bg-slate-50 p-4 pb-20 animate-bounce-in">
